# F3 · Piso del eje "cuándo": el mismo LightGBM del control, con UNA sola feature — el
# odómetro del corte. No sabe nada de degradación; solo sabe dónde está el corte.
#
#   python scripts/build_positional_panel.py --config configs/data/panel_positional.yaml
#   python scripts/train.py --config configs/exp_positional_baseline.yaml
#
# No es un candidato: es una referencia, como `exp_baserate.yaml` lo es del PR-AUC. No
# gasta presupuesto de comparaciones (CLAUDE.md).
#
# QUÉ CONTESTA. Dentro de un vehículo fallado la etiqueta es una función determinista de
# la posición del corte —la fracción positiva por posición desde el final va 1,00 / 1,00
# / 0,98 / 0,93 / 0,92 / 0,87 y después 0,00 de golpe—, porque el historial de un
# vehículo con evento termina en el evento. Entonces cualquier score que crezca con el
# odómetro ordena los cortes de un fallado casi perfecto **sin saber nada de
# degradación**, y las métricas del eje "cuándo" —(a'), ROC intra-vehículo, PR-AUC entre
# fallados— no se pueden leer contra cero. Esta corrida mide el piso real de ese eje.
#
# Y EL PUNTO DE OPERACIÓN ES LA OTRA MITAD. Un score posicional también alerta los
# últimos cortes de los SANOS, que no tienen ningún evento detrás: falsas alarmas puras.
# Si los modelos le ganan al piso ahí, la curva de anticipación sigue siendo la métrica
# honesta del pitch; si no le ganan, el problema es más profundo que la métrica.
#
# POR QUÉ LightGBM Y NO UN SCORE CRUDO. El `Pipeline` de `cv.py` z-scorea las numéricas
# con el train de cada fold, así que un score que sea el odómetro tal cual no es
# comparable entre folds, y los umbrales de la curva de anticipación son globales sobre
# los 5 folds juntos: medido así el piso se subestima (0,1608 de PR-AUC y 5,7% de
# detección, contra 0,1766 y 7,5% con el ranking global). LightGBM devuelve una
# probabilidad calibrada, que sí se puede juntar entre folds, y además es el piso más
# exigente: es lo mejor que se puede sacar de la posición sola. Mismo builder y mismos
# hiperparámetros que el control, para que la única diferencia sea el panel.
#
# Mismas filas y mismos folds que `exp_lgbm_panel_v1.yaml`.
name: f3-positional-baseline
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_positional.parquet

splits:
  path: ${DATA_DIR}/processed/splits.json
  n_splits: 5
  seed: 42
  build_if_missing: false    # los folds congelados del panel v1: mismas filas, misma huella
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 1
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: lgbm                 # mismos defaults que el control: la diferencia es el panel
  params:
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-pisos
  job_type: train
  tags: [f3, piso, cuando, referencia]
  mode: online
  log_artifacts: false

output_dir: experiments
