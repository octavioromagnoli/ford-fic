# F3 · Supervivencia en tiempo discreto sobre el panel v1 ("survival stacking").
#
# Mismo panel, mismas filas y mismos folds que configs/exp_lgbm_panel_v1.yaml: la
# diferencia es con qué objetivo se entrena. La etiqueta binaria contesta "¿el evento
# cae en [c+G, c+G+H]?" y descarta dónde dentro del horizonte cae, qué pasa después de
# H, y que un sano es un censurado y no un cero. El apilado (Craig, Zhong & Tibshirani
# 2021, arXiv:2107.13480) usa las tres cosas; el score sigue siendo la probabilidad del
# mismo evento, `1 − S(H|x)`, así que el PR-AUC es comparable fila a fila con el resto
# de la tabla de resultados.
#
#   python scripts/build_survival_panel.py --config configs/data/panel_survival.yaml
#   python scripts/train.py --config configs/exp_survival_stacking.yaml
#
# El efecto aleatorio por vehículo es el hermano de este config
# (`configs/exp_gpboost_survival.yaml`, `model.name: gpboost_survival`): lo único que
# cambia entre los dos es el backend, así que la diferencia de PR-AUC es lo que aporta.
name: f3-survival-stacking
seed: 42

data:
  # Panel v1 + `feat_cut_odo`. Mismas filas (misma huella ⇒ el splits.json sirve tal
  # cual); la columna extra es el hazard base sobre el odómetro, que el panel v1 tiene
  # como identificador y no como covariable.
  panel: ${DATA_DIR}/processed/panel_survival.parquet

splits:
  path: ${DATA_DIR}/processed/splits.json
  n_splits: 5
  seed: 42
  build_if_missing: false    # los folds los deja scripts/build_dataset.py, sobre dev
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 1
  test_split: ${DATA_DIR}/processed/test_split.json

# Con qué se entrena (src/training/targets.py). Lo que se evalúa no cambia: `label`.
target:
  name: discrete_survival
  params: {}                 # gap_km sale del panel; no se duplica acá

model:
  name: survival_stacking    # sin efecto aleatorio: el control de gpboost_survival
  params:
    horizon_km: 3000         # H del panel: define `label`, así que no se toca sin rehacerlo
    bin_km: 500              # Δ del panel ⇒ 6 bins de hazard dentro del horizonte
    # Hasta dónde se entrena el hazard. Más allá de H es donde el apilado gana lo que la
    # etiqueta binaria no tiene: un vehículo que falla a 5.000 km del corte deja de ser
    # un cero indistinguible de un sano. El score sigue siendo el riesgo a H.
    max_horizon_km: 6000
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50
  # Intervalo remuestreando vehículos, no filas: los ~5 cortes de un auto no son
  # observaciones independientes y el bootstrap por fila devuelve un intervalo falso.
  bootstrap_by_vehicle: true
  bootstrap_n_boot: 1000

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-survival
  job_type: train
  tags: [f3, survival, stacking, panel-v1]
  mode: online
  log_artifacts: false

output_dir: experiments
