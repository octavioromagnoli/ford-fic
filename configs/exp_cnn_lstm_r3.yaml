# F3 · CONTROL del modelo secuencial GRU, re-medido sobre el panel RECONSTRUIDO y con
# CV repetida (R = 3).
#
# Dos cosas lo separan de `configs/exp_cnn_lstm.yaml` y las dos invalidan la comparación con el número
# viejo si se ignoran:
#
# 1. El umbral de regeneración pasó de 5 a 15 puntos (commit 1eab4a1,
#    docs/reproducibilidad.md). El panel y el panel secuencial se
#    reconstruyeron: las features cambiaron de valor, las filas y los folds no.
# 2. R = 3 (`splits_r3.json`) en vez de R = 1. La repetición 0 son exactamente los
#    folds de `splits.json`, así que esto complementa lo viejo, no lo contradice.
#
# Existe para que la tabla de `docs/reproducibilidad.md` compare modelos
# medidos con la misma regla, no contra números de otra versión del panel.
#
#   python scripts/train.py --config configs/exp_cnn_lstm_r3.yaml
#
name: f3-cnn-lstm-r3-regen15
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_seq_v1.parquet

splits:
  path: ${DATA_DIR}/processed/splits_r3.json
  n_splits: 5
  seed: 42
  build_if_missing: false
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 3
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: cnn_lstm
  params:
    # Forma del tensor (T bins × C canales): la escribe el builder del panel secuencial.
    sequence_meta: ${DATA_DIR}/processed/panel_seq_v1_meta.json
    # Rama dinámica
    conv_channels: 16
    kernel_size: 3          # 3 bins = 150 km de contexto local por filtro
    lstm_hidden: 16
    # Rama estática (hoy solo el one-hot de SalesCountry_cd)
    static_hidden: 4
    # Cabeza después de la fusión
    head_hidden: 16
    dropout: 0.3
    # Entrenamiento: épocas fijas, sin early stopping (ver docstring del modelo)
    epochs: 40
    batch_size: 64
    learning_rate: 0.001
    weight_decay: 0.0001
    grad_clip: 1.0
    class_weight: balanced  # pos_weight = negativos/positivos del train del fold
    device: cpu             # determinista; `mps` anda pero no hace falta con este tamaño
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-secuenciales
  job_type: train
  tags: [f3, cnn-lstm, tutora, panel-seq-v1, r3, regen15]
  mode: online
  log_artifacts: false

output_dir: experiments
