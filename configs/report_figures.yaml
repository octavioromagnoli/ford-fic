# Figuras y tablas del informe final (docs/informe/). No entrena ni mide nada: lee salidas que ya existen
# en experiments/ y tablas de docs/memoria/ copiadas acá con su fuente, y escribe PDF y .tex.
#
#   python scripts/make_report_figures.py --config configs/report_figures.yaml
#
# Cada bloque `from_memo` es una tabla tal como está en la ficha que dice `source`: si la ficha cambia, se
# cambia acá y se regenera. Lo que sale de experiments/ se lee del CSV/JSON, nunca se tipea.
seed: 0
output:
  figures_dir: docs/informe/figuras
  tables_dir: docs/informe/tablas

style:
  # Paleta de referencia de la guía de visualización (validada: 3 primeros slots, todos los pares, modo claro).
  # La GRU es el foco; survival stacking, el contraste; el resto en gris.
  colors:
    focus: "#2a78d6"
    second: "#eb6834"
    third: "#1baf7a"
    muted: "#a3a29d"
    null_band: "#e6e5e1"
    text: "#0b0b0b"
    text_secondary: "#52514e"
    grid: "#ebeae6"
  font_size: 9
  width_in: 6.3

# --- salidas de experiments/ (no versionadas, en disco) -------------------------------------------------
test:
  curve: experiments/test-modelos-v2/curve.csv
  operating: experiments/test-modelos-v2/operating.csv
  paired: experiments/test-modelos-v2/paired.csv
  report_f10: experiments/test-f10-s42/report.json
  subset: test
  budgets_table: [0.02, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
  null_model: gru_f10            # el nulo que se dibuja es el del finalista (conserva el largo de su historial)
  models:                        # orden de la tabla y etiqueta; `role` decide el color; `short`, el nombre en la nota de grises
    gru_f10: {label: "GRU ×3 (finalista)", role: focus}
    survival_stacking: {label: "Survival stacking", role: third, label_dy: 4}
    lightgbm: {label: "LightGBM (53 features)", short: "LightGBM", role: muted}
    logistica_l2: {label: "Logística L2 (53 features)", short: "logística", role: muted}
    ss_efecto_aleatorio: {label: "SS + efecto aleatorio (GPBoost)", short: "GPBoost", role: muted}
  # AUC por auto: no está en report.json; tabla de f11-test-resultado.md §3.
  auc_from_memo:
    source: docs/memoria/f11-test-resultado.md §3
    gru_f10: 0.794
    survival_stacking: 0.710
    lightgbm: 0.725
    logistica_l2: 0.679
    ss_efecto_aleatorio: 0.363
  # Detección en dev (CV, 5 · 10 · 20%) de los mismos modelos: f11-test-resultado.md §3.
  dev_from_memo:
    source: docs/memoria/f11-test-resultado.md §3
    gru_f10: "27 · 42 · 61"
    survival_stacking: "14 · 24 · 42"
    lightgbm: "18 · 28 · 42"
    logistica_l2: "15 · 23 · 37"
    ss_efecto_aleatorio: "6 · 9 · 17"

explain:
  units: experiments/explain-gru-final/units.csv
  source: configs/explain_gru_final.yaml (dev, semilla 42, repetición 0 de splits_r3)
  labels:
    static_SalesCountry_cd: "País"
    trip_duration_min: "Duración de los viajes"
    n_records: "Registros de señales"
    acum_rise: "Subida de la acumulación del DPF"
    static_Engine: "Motor"
    n_trips: "Cantidad de viajes"
    observed: "Bin con datos de señales"
    acum_mean: "Acumulación media"
    trip_km: "Km por viaje"
    acum_max: "Acumulación máxima"
    regen_drops: "Regeneraciones (caídas)"
    static_ModelSeries: "Serie del modelo"
    msg_cleaning_auto_frac: "Avisos de limpieza automática"
    speed_kmh: "Velocidad"
    below_regime_frac: "Motor bajo régimen (< 70 °C)"
    msg_full_frac: "Avisos de filtro lleno"
    msg_severe_frac: "Avisos severos"
    idle_frac: "Ralentí (viajes de 0 km)"
  families:
    "hábitos": "Hábitos"
    "estado DPF": "Estado del DPF"
    "cobertura": "Cobertura"
    "estática": "Contexto (estática)"

features:
  spec: configs/data/features_v1.yaml
  sequence: configs/data/panel_seq_trips_v2_estaticas.yaml

# --- tablas de docs/memoria/ ------------------------------------------------------------------------------
from_memo:
  profile:
    source: docs/memoria/f9-eda-v2.md §E (dev, referencia = fecha registrada, contra sanos del mismo mercado y tramo de odómetro)
    bins: ["4–8k km antes", "2–4k", "0–2k"]
    series:
      "Ralentí": {values: [0.60, 0.64, 0.76], role: focus, label_dy: 4}
      "Bajo régimen": {values: [0.55, 0.62, 0.73], role: second, label_dy: -4}
      "Refrigerante": {values: [0.47, 0.39, 0.29], role: third}
      "Velocidad": {values: [0.51, 0.47, 0.49], role: muted}
  score_toward_event:
    source: docs/memoria/f11-test-resultado.md §4 (test, rango percentil medio, promedio de las 3 semillas)
    bins: ["Sanos", "> 10.000 km", "3.500–10.000 km", "< 3.500 km"]
    values: [0.44, 0.58, 0.61, 0.72]
