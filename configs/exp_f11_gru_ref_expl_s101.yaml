# F11 (docs/memoria/f11-preregistro-objetivo-suave.md): GRU + TripSummary + estática completa, referencia con label (la GRU de hoy); semilla del modelo 101, folds de la exploración (splits_r3).
#   WANDB_MODE=disabled python scripts/train.py --config configs/exp_f11_gru_ref_expl_s101.yaml
name: f11-gru-ref-expl-s101
seed: 101
data:
  panel: ${DATA_DIR}/processed/panel_seq_trips_v2_estaticas.parquet
splits:
  path: ${DATA_DIR}/processed/splits_r3.json
  n_splits: 5
  seed: 42
  build_if_missing: false
  strict: true
  stratify:
    column: label
    level: vehicle
    extra_columns:
    - static_SalesCountry_cd
    - aux_static_Engine
    min_stratum_size: 5
  min_valid_positives: 5
  n_repeats: 3
  test_split: ${DATA_DIR}/processed/test_split.json
model:
  name: gru_seq
  params:
    sequence_meta: ${DATA_DIR}/processed/panel_seq_trips_v2_estaticas_meta.json
    pooling: attention
    hidden: 24
    num_layers: 1
    attention_hidden: 16
    static_hidden: 4
    head_hidden: 16
    dropout: 0.3
    epochs: 40
    batch_size: 64
    learning_rate: 0.001
    weight_decay: 0.0001
    grad_clip: 1.0
    class_weight: balanced
    device: cpu
    random_state: 101
eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50
  bootstrap_by_vehicle: true
  bootstrap_n_boot: 1000
wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f11-objetivo-suave
  job_type: train
  tags:
  - f11
  - v2
  - r3
  - ref
  - expl
  mode: online
  log_artifacts: false
output_dir: experiments
