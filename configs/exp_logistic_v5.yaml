# F3 · primer modelo real contra el panel. Hasta el 19-09 el registry solo tenia
# `baserate` y `random`: todo lo que se sabia del panel era separacion UNIVARIADA
# (la mejor columna sola da ROC ~ 0,60). Esto responde la otra pregunta: que pasa
# cuando el modelo puede combinar las columnas.
#
#   python scripts/train.py --config configs/exp_logistic_v5.yaml
#
# OJO: los eventos tienen una falla conocida (error de SQL) y la mentora los va a
# corregir. Estos numeros son provisorios.
name: f3-logistic-panel-v5
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_v5.parquet

splits:
  path: ${DATA_DIR}/processed/splits_v5.json
  n_splits: 5
  seed: 42
  build_if_missing: false    # los folds los deja scripts/build_dataset.py, sobre dev
  strict: true
  # Tiene que decir lo mismo que el splits.json congelado: los folds salen del
  # archivo, así que si esto no coincide, train.py falla en vez de entrenar una
  # corrida distinta de la que el YAML describe. Se regenera con
  # `python scripts/make_splits.py --config configs/data/panel_v1.yaml`.
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5     # guarda dura: filas label=1 por fold en validación
  n_repeats: 1               # CV repetida: R pasadas con semillas distintas
  # Holdout dev/test congelado (regla 2): la CV corre solo sobre dev.
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: logistic
  params:
    C: 0.1


eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-modelos
  job_type: train
  tags: [f3, modelo, logistic, panel-v5]
  mode: online
  log_artifacts: false

output_dir: experiments
