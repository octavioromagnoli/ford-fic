# F3 · LightGBM chico sobre el panel v1: el control de las ablaciones de familias nuevas.
# Cada familia se mide como variante del panel con las mismas filas
# (`src/data/panel.py::attach_columns`) y un exp_lgbm_<familia>.yaml igual a este salvo
# `data.panel`: mismo modelo, mismos folds. La diferencia de PR-AUC es lo que aporta la familia.
#
#   python scripts/train.py --config configs/exp_lgbm_panel_v1.yaml
name: f3-lgbm-panel-v1
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel.parquet

splits:
  path: ${DATA_DIR}/processed/splits.json
  n_splits: 5
  seed: 42
  build_if_missing: false    # los folds los deja scripts/build_dataset.py, sobre dev
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 1
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: lgbm                 # defaults del builder: CLAUDE.md
  params:
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-feature-ablation
  job_type: train
  tags: [f3, lgbm, panel-v1, control]
  mode: online
  log_artifacts: false

output_dir: experiments
