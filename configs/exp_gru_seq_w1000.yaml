# F3 · BARRIDO DE VENTANA: la fila W = 1.000 km, con los mismos 15 canales, el mismo
# pooling y los mismos hiperparámetros que `exp_gru_seq_w2000.yaml` y `w3000`.
#
# Existe para que el barrido compare SOLO la ventana: mismo modelo, mismos canales,
# y en cada ventana los folds congelados de ese panel (R = 1). Su par es
# `exp_lgbm_panel_v1.yaml`.
#
#   python scripts/train.py --config configs/exp_gru_seq_w1000.yaml
#   python scripts/seed_spread.py --config configs/exp_gru_seq_w1000.yaml --seeds 5
#
# Necesita PyTorch (opcional): `uv pip install -r requirements-dl.txt`.
name: f3-gru-seq-w1000
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_seq_trips.parquet

splits:
  # Los folds del panel v1 con R = 3 (el panel secuencial tiene las mismas filas, así
  # que la huella coincide). La repetición 0 son exactamente los folds de `splits.json`:
  # el número de R=1 de las corridas viejas sigue siendo comparable, y las otras dos
  # repeticiones dicen cuánto de la diferencia entre modelos es el sorteo de folds.
  path: ${DATA_DIR}/processed/splits.json
  n_splits: 5
  seed: 42
  build_if_missing: false
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 1
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: gru_seq
  params:
    # Forma del tensor (T bins × C canales) y geometría de la ventana (L, bin_km):
    # las escribe el builder del panel secuencial. Nada de esto se hardcodea.
    sequence_meta: ${DATA_DIR}/processed/panel_seq_trips_meta.json
    # Rama dinámica
    # `last` y no `attention`: la ablación de pooling sobre W = 1.000 (5 semillas, R=3)
    # dio last 0,1645 > mean 0,1588 > attention 0,1515, y la auditoría de
    # `attention_weights()` mostró por qué —la atención aprende a mirar el final de la
    # ventana, difuso—. El barrido tiene que usar la variante elegida, o mide la
    # ventana y el pooling a la vez (docs/memoria/f3-gru-secuencial.md).
    pooling: last
    hidden: 24
    num_layers: 1
    attention_hidden: 16
    # Rama estática (hoy solo el one-hot de SalesCountry_cd); 0 la apaga
    static_hidden: 4
    # Cabeza después de la fusión
    head_hidden: 16
    dropout: 0.3
    # Entrenamiento: épocas fijas, sin early stopping (ver docstring del modelo)
    epochs: 40
    batch_size: 64
    learning_rate: 0.001
    weight_decay: 0.0001
    grad_clip: 1.0
    class_weight: balanced  # pos_weight = negativos/positivos del train del fold
    device: cpu
    # Una semilla no es un resultado: la media y el rango sobre >= 5 semillas salen de
    # `python scripts/seed_spread.py --config configs/exp_gru_seq_trips.yaml`.
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-secuenciales
  job_type: train
  tags: [f3, gru, barrido-ventana, w1000]
  mode: online
  log_artifacts: false

output_dir: experiments
