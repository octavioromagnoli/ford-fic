# F9 · La GRU `last` de F3 medida con la etiqueta corregida por la ventana del registro: el modelo de la demo de
# producto (docs/reproducibilidad.md).
#
# **No es un candidato ni una comparación nueva** (el presupuesto de comparaciones está agotado): no va a
# `results/`, no cambia el finalista y el veredicto de `window_eval` no aplica. Es `configs/exp_gru_seq_last.yaml`
# con un solo cambio, el panel: `panel_seq_kmw` es `panel_seq_v1` con las mismas filas y las mismas feat_seq_* y
# static_ (el modelo recibe la misma entrada) más las aux_ de la ventana (`scripts/join_window_columns.py`), que
# es lo que necesita la etiqueta V. Misma arquitectura, misma semilla, mismos folds que K2.
#
#   FORD_DATA_DIR=$PWD/data/rebuild-0921 python scripts/join_window_columns.py --config configs/data/panel_seq_kmw.yaml
#   FORD_DATA_DIR=$PWD/data/rebuild-0921 WANDB_MODE=disabled python scripts/train.py --config configs/exp_gru_seq_last_kmw.yaml
#   FORD_DATA_DIR=$PWD/data/rebuild-0921 python scripts/eval_window_label.py --config configs/exp_gru_seq_last_kmw.yaml
#
# Necesita PyTorch (opcional): `uv pip install -r requirements-dl.txt`.
name: f9-gru-seq-last-kmw
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_seq_kmw.parquet

splits:
  path: ${DATA_DIR}/processed/splits_r3.json
  n_splits: 5
  seed: 42
  build_if_missing: false
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 3
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: gru_seq
  params:
    sequence_meta: ${DATA_DIR}/processed/panel_seq_v1_meta.json
    pooling: last
    hidden: 24
    num_layers: 1
    attention_hidden: 16
    static_hidden: 4
    head_hidden: 16
    dropout: 0.3
    epochs: 40
    batch_size: 64
    learning_rate: 0.001
    weight_decay: 0.0001
    grad_clip: 1.0
    class_weight: balanced
    device: cpu
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

# scripts/eval_window_label.py: la GRU con las dos etiquetas (D y V). El script pide una referencia contra la cual
# medir: es K2, el finalista, con las mismas filas y los mismos folds. El veredicto que imprime no se lee: la GRU
# no compite por nada.
window_eval:
  reference: f6-ss-hw-r3
  evaluable_column: aux_eval_in_window
  decides: corrected
  floors: [cut_odo, aux_cut_dss]
  a0_tolerance: 0.02

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f9-demo
  job_type: train
  tags: [f9, demo, gru, panel-seq-kmw, no-candidato]
  mode: online
  log_artifacts: false

output_dir: experiments
