# F3 · el control (LightGBM sobre el panel v1) con CV repetida R=3
#
# Copia EXACTA de configs/exp_lgbm_panel_v1.yaml con una sola diferencia: `splits.n_repeats: 3`
# y el juego de folds repetido (`splits_r3.json`, misma huella de panel). No se toca
# ningún hiperparámetro del modelo — si algo más cambiara, la comparación con la
# corrida R=1 dejaría de medir solo el efecto del sorteo de folds.
#
# Para qué: declarar (a') y la detección **con su dispersión entre repeticiones**
# (`src/eval/metrics.py::dispersion`). Una diferencia de PR-AUC más chica que ese
# desvío no es una diferencia, es el sorteo.
#
#   python scripts/train.py --config configs/exp_lgbm_panel_v1_r3.yaml
name: f3-lgbm-panel-v1-r3
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel.parquet

splits:
  path: ${DATA_DIR}/processed/splits_r3.json   # R=3, misma huella de panel
  n_splits: 5
  seed: 42
  build_if_missing: false    # los folds los deja scripts/build_dataset.py, sobre dev
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 3               # <- la única diferencia con la corrida R=1
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: lgbm                 # defaults del builder: docs/f3-modelos-candidatos.md §1.3
  params:
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-feature-ablation
  job_type: train
  tags: [f3, lgbm, panel-v1, control, r3]
  mode: online
  log_artifacts: false

output_dir: experiments