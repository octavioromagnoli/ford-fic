# F3 · CONTROL del modelo secuencial GRU, re-medido sobre el panel RECONSTRUIDO y con
# CV repetida (R = 3).
#
# Dos cosas lo separan de `configs/exp_lgbm_panel_v1.yaml` y las dos invalidan la comparación con el número
# viejo si se ignoran:
#
# 1. El umbral de regeneración pasó de 5 a 15 puntos (commit 1eab4a1,
#    docs/memoria/f2-umbral-regeneraciones.md). El panel y el panel secuencial se
#    reconstruyeron: las features cambiaron de valor, las filas y los folds no.
# 2. R = 3 (`splits_r3.json`) en vez de R = 1. La repetición 0 son exactamente los
#    folds de `splits.json`, así que esto complementa lo viejo, no lo contradice.
#
# Existe para que la tabla de `docs/memoria/f3-gru-secuencial.md` compare modelos
# medidos con la misma regla, no contra números de otra versión del panel.
#
#   python scripts/train.py --config configs/exp_lgbm_panel_v1_r3.yaml
#
name: f3-lgbm-panel-v1-r3-regen15
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel.parquet

splits:
  path: ${DATA_DIR}/processed/splits_r3.json
  n_splits: 5
  seed: 42
  build_if_missing: false
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 3
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: lgbm                 # defaults del builder: docs/f3-modelos-candidatos.md §1.3
  params:
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-feature-ablation
  job_type: train
  tags: [f3, lgbm, panel-v1, control, r3, regen15]
  mode: online
  log_artifacts: false

output_dir: experiments
