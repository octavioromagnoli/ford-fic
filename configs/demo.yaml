# Demo de producto (MVP para el pitch del 02-10-2026): la flota de dev reproducida en el calendario con la GRU,
# una bandeja semanal de triage y dos agentes (redactor + verificador, triage). docs/memoria/f9-demo-gru.md.
#
#   FORD_DATA_DIR=$PWD/data/v2 python scripts/build_demo_bundle.py --config configs/demo.yaml
#   python scripts/warm_demo_cache.py --config configs/demo.yaml --prune   # agentes, todas las semanas
#   python scripts/build_demo_bundle.py --config configs/demo.yaml --publish-only
#   streamlit run scripts/demo_app/app.py
#
# Necesita la entrega v2 (FORD_DATA_DIR con los paneles v2 y `splits_r3.json`) y las tres semillas del modelo final
# con su ensamble (docs/memoria/f11-test-resultado.md):
#   WANDB_MODE=disabled python scripts/train.py --config configs/exp_v2all_gru_trips_estaticas{,_s1,_s2}_r3.yaml
#   WANDB_MODE=disabled python scripts/ensemble_rank.py --config configs/exp_v2all_seeds3_gru_trips_estaticas.yaml
# **No cambia ninguna métrica**: el score, el umbral y la alerta son los del ensamble en una repetición, tal cual.
# Solo dev: el builder falla si aparece un vehículo de test.

product_name: Ford DPF

# La marca que se ve en la app (barra lateral, celular, login, pestaña del navegador y «Cómo usar»): el script de Ford
# × el equipo. `product_name` sigue siendo el nombre interno, el del bundle y los prompts de los agentes; ningún texto
# generado lo escribe.
brand:
  team: SOG
  page_title: SOG · Ford Innovation Challenge III

# El modelo que puntúa la flota: el finalista, medido en test el 01-10 (docs/memoria/f11-test-resultado.md). Es la
# GRU + TripSummary + estática completa entrenada con `label`, en ensamble por rango de las semillas 42, 1 y 2 sobre
# los folds `splits_r3`. Nombre y familia viajan en la meta del bundle: la app no los escribe a mano.
model:
  name: GRU
  family: red recurrente, ensamble de 3 semillas
  run_config: configs/exp_v2all_seeds3_gru_trips_estaticas.yaml
  # La GRU lee la ventana en bins (panel_seq_trips_v2_estaticas). El perfil de uso y las señales del filtro salen
  # del panel de agregados del que se armó, con las mismas filas (load_run verifica el merge 1:1).
  profile_panel: ${DATA_DIR}/processed/panel_v2_estaticas.parquet
  score_note: "El puntaje es el rango medio de tres semillas de la GRU: ordena autos, no es una probabilidad."

# El "por qué". La GRU no tiene atribución: es una comparación descriptiva con los autos sanos de dev del mismo
# mercado (src/eval/fleet_profile.py), no lo que el modelo usó. Fijado antes de construir el bundle.
explanation:
  type: fleet_profile
  # Clase (accionable / síntoma / contexto) y signo físico de cada hábito: la clasificación preregistrada de F4. Es
  # física del DPF, no depende del modelo.
  classification: configs/explain_k2.yaml
  # Etiquetas, frases y recomendaciones: la lista cerrada del mensaje al conductor.
  texts: configs/explain_texts.yaml
  # Se nombra un hábito del lado riesgoso si el auto es más extremo que esta parte de los sanos de su mercado.
  min_healthy_share: 0.75
  max_factors: 3
  # Un mercado con menos autos sanos no alcanza como referencia (el builder falla). En dev v2 el mínimo es PER, 20.
  min_healthy_vehicles: 10
  # Lo que cambia del mensaje de explain_texts.yaml: el marco es la flota sana, no el parecido con autos que fallaron.
  message:
    factors_intro: "Comparado con autos sanos de tu mercado, en tu auto:"
    no_factors: "Comparado con autos sanos de tu mercado, ninguno de los hábitos que este análisis puede señalar se aparta hacia el lado que perjudica al filtro."
    disclaimer: "Esto no es un diagnóstico: el sistema marca autos para revisarlos a tiempo. Si nombramos hábitos, es en comparación con autos sanos de tu mercado, no una causa ni lo que miró el sistema."

# Una sola repetición, la misma para el score, el umbral, la alerta y el mensaje. La entrega v2 no tiene ventana del
# registro: la etiqueta es la dura (D), con todas las filas de dev.
label: hard
repeat: 0
# Los puntos de operación de la perilla de la app: falsas alarmas toleradas cada 1.000 autos sanos (5, 10, 15 y 20%).
# Cada uno trae su umbral exacto, sus alertas, sus mensajes y su triage; la demo abre en el primero. Dónde operar es
# una decisión de costo de Ford: la perilla deja ver qué cambia. Todos tienen que estar en `official.budgets`.
operating_points: [50, 100, 150, 200]
default_budget_per_1000: 50

# Los números oficiales: la cuenta de scripts/report_v2_models.py (la del reporte v2 y el sweep), sobre las 3
# repeticiones. Umbral exacto por presupuesto, nulo de bolsa y fuera de muestra.
official:
  budgets: [0.02, 0.05, 0.10, 0.15, 0.20]
  null_permutations: 200
  n_thresholds: 50
  bag_diag_healthy_cuts: 9
  seed: 0
  # Mercado y motor por auto: el AUC dentro de la celda (la composición que la tasa de la celda ya explica).
  cell_columns: [static_SalesCountry_cd, static_Engine]

replay:
  # Semanas de lunes a domingo, de la primera revisión de dev (05-03-2025) al fin de la extracción de los fallados
  # (24-09-2026): la telemetría se corta el 14-09 para todos, pero hay eventos registrados hasta el 21-09.
  start: "2025-03-03"
  end: "2026-09-24"
  # La semana en que abre la demo: la primera con al menos 3 alertas nuevas en el punto que abre (5%). Son 4, las 4 de
  # autos que fallaron después (VEH_0451, VEH_0563, VEH_0566, VEH_0583); dos tienen hábitos que nombrar y dos van al
  # concesionario. Es una sola para toda la perilla: al cambiar el punto de operación, la semana elegida se queda.
  first_week: "2025-09-29"
  description: "de la primera revisión de la flota de desarrollo al fin de la extracción de datos de Ford"

# Perfil de uso que se grafica en la ficha del vehículo. Los hábitos que el "por qué" puede nombrar salen de acá
# (los accionables de la lista cerrada; km por día es contexto: convierte el horizonte a semanas).
profile_features:
  - feat_speed_kmh_mean
  - feat_trips_below_regime_temp_frac
  - feat_idle_frac
  - feat_idle_per_1000km
  - feat_short_trip_frac_5km
  - feat_trips_below_30kmh_frac
  - feat_engine_temp_avg_median
  - feat_km_per_day

# Señales del propio filtro: van al resumen del taller, nunca al conductor (son síntomas, no hábitos).
# Se comparan con la mediana de los autos sanos de dev del mismo mercado (una mediana por auto, y la
# mediana de esas). `scale` pasa el valor a la unidad de `format` (los niveles del DPF vienen en %).
technician_signals:
  feat_dpf_end_mean:                   {label: Carga del DPF al final del viaje, format: pct, scale: 0.01}
  feat_dpf_end_max:                    {label: Carga máxima del DPF, format: pct, scale: 0.01}
  feat_regen_residual_mean:            {label: Carga que queda después de regenerar, format: pct, scale: 0.01}
  feat_dpf_positive_delta_frac:        {label: Viajes en que la carga del DPF sube, format: pct}
  feat_regenerations_per_1000km:       {label: Regeneraciones cada 1.000 km, format: dec1}
  feat_distance_between_regen_mean_km: {label: Km entre regeneraciones, format: int_km}
  feat_msgs_per_1000km:                {label: Avisos del filtro cada 1.000 km, format: int}
  feat_oil_life_mean:                  {label: Vida de aceite restante, format: pct, scale: 0.01}

# Fecha del evento de cada fallado: el origen del calendario congelado en el build del panel y la
# tabla estática (src/data/anchor.py::event_dates). La app no la recalcula: viaja en el bundle.
event_dates:
  sources: configs/data/raw_sources.yaml
  dedupe: configs/data/vehicle_dedupe.yaml
  panel_config: configs/data/panel_v2.yaml
  anchor_meta: ${DATA_DIR}/processed/panel_meta.json

bundle:
  dir: experiments/demo-bundle-gru-final
  # wandb Artifact que baja la app desplegada. La versión se fija acá (`v0`, `v1`…) para que la demo no cambie
  # sola: publicar y cambiar el pin es una decisión. Los bundles anteriores no se tocan.
  # v0 (01-10): el modelo final (GRU con `label`, semillas 42/1/2), los cuatro puntos de la perilla y su triage
  # (docs/memoria/f9-demo-gru-final.md).
  artifact: demo-bundle-gru-final
  version: v0
  entity: oromagnoli-
  project: ford-fic
