# Re-medición sobre la ENTREGA v2 (26-09-2026): el análogo de K2 con motor y modelo como static_, R=3.
# Ablación pareada contra exp_v2_ss_hfull_r3.yaml: mismas filas y folds, dos estáticas más.
#
# Mismo modelo y mismos hiperparámetros que configs/exp_v2_ss_hfull_r3.yaml; cambian los datos (panel_v2.yaml:
# universo de 557, fecha de referencia − 21 d, folds por label × mercado × motor). No es
# un candidato nuevo: hace comparable una fila que ya existía (presupuesto de comparaciones).
#
#   WANDB_MODE=disabled python scripts/train.py --config configs/exp_v2_ss_hfull_r3_estaticas.yaml
name: f9-v2-ss-hfull-r3-estaticas
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_survival_estaticas.parquet

splits:
  path: ${DATA_DIR}/processed/splits_r3.json
  n_splits: 5
  seed: 42
  build_if_missing: false
  strict: true
  stratify:
    column: label
    level: vehicle
    extra_columns: [static_SalesCountry_cd, aux_static_Engine]   # lo que declara el archivo de folds
    min_stratum_size: 5
  min_valid_positives: 5
  n_repeats: 3
  test_split: ${DATA_DIR}/processed/test_split.json

target:
  name: discrete_survival
  params: {}

model:
  name: survival_stacking
  params:
    horizon_km: 3000
    bin_km: 500
    max_horizon_km: 55000
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50
  bootstrap_by_vehicle: true
  bootstrap_n_boot: 1000

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f9-v2
  job_type: train
  tags: [f9, v2, survival, horizonte-completo, estaticas, r3]
  mode: online
  log_artifacts: false

output_dir: experiments
