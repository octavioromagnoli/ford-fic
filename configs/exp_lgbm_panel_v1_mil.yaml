# F3 · el mismo LightGBM del control (`configs/exp_lgbm_panel_v1.yaml`), medido también
# por vehículo: Ford marca autos, no cortes. Copia exacta de aquel salvo `name` y el
# bloque `eval.vehicle_aggregation` —mismo modelo, mismo panel, mismos folds—, así que
# la diferencia contra `f3-lgbm-panel-v1` es solo el eje de evaluación y nada más.
#
# OJO: el PR-AUC por vehículo NO se compara contra el de filas (tasa base 0,31 vs 0,125).
# Lo comparable es el lift. Ver docs/reproducibilidad.md
#
#   python scripts/train.py --config configs/exp_lgbm_panel_v1_mil.yaml
name: f3-lgbm-panel-v1-mil
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel.parquet

splits:
  path: ${DATA_DIR}/processed/splits.json
  n_splits: 5
  seed: 42
  build_if_missing: false    # los folds los deja scripts/build_dataset.py, sobre dev
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 1
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: lgbm                 # defaults del builder: CLAUDE.md
  params:
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50
  # Agregación de la bolsa (los cortes de un vehículo) a un score único.
  # Lista vacía o `null` para no medir el eje de vehículo.
  vehicle_aggregation: [max, mean, topk, noisy_or]
  vehicle_topk: 3           # `topk` = media de los 3 cortes mayores del vehículo
  # Barrido del ratio C_FN/C_FP: el control también lo reporta, porque un punto de
  # quiebre sin línea de base no se interpreta. Es reporte, no selección
  # (docs/reproducibilidad.md).
  cost_ratios: [2, 3, 5, 7, 10, 20, 50]
  cost_fp: 1.0

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-feature-ablation
  job_type: train
  tags: [f3, lgbm, panel-v1, control]
  mode: online
  log_artifacts: false

output_dir: experiments
