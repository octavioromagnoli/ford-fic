# F3 · LightGBM chico sobre el panel v1 + resúmenes del pronóstico de TimesFM (feat_tfm_*).
# Par de exp_lgbm_panel_v1.yaml: mismo modelo, mismas filas, mismos folds; lo único que
# cambia son las 9 columnas feat_tfm_* (3 por canal, configs/data/panel_timesfm_v1.yaml).
#
#   python scripts/build_timesfm_panel.py --config configs/data/panel_timesfm_v1.yaml
#   python scripts/train.py --config configs/exp_lgbm_timesfm.yaml
name: f3-lgbm-timesfm
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_timesfm.parquet   # scripts/build_timesfm_panel.py

splits:
  path: ${DATA_DIR}/processed/splits.json
  n_splits: 5
  seed: 42
  build_if_missing: false    # los folds los deja scripts/build_dataset.py, sobre dev
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 1
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: lgbm                 # defaults del builder: docs/f3-modelos-candidatos.md §1.3
  params:
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-feature-ablation
  job_type: train
  tags: [f3, lgbm, panel-v1, timesfm]
  mode: online
  log_artifacts: false

output_dir: experiments
