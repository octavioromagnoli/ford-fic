# F3 · piso absoluto contra el panel REAL: tasa base sobre dev con los folds congelados.
# Es la referencia contra la que se compara todo lo demás; un modelo que no le gana
# está roto. Las métricas TIENEN que dar PR-AUC ≈ tasa base y ROC-AUC ≈ 0,5.
#
#   python scripts/train.py --config configs/exp_baserate.yaml
name: f3-baserate-panel-v1
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel.parquet

splits:
  path: ${DATA_DIR}/processed/splits.json
  n_splits: 5
  seed: 42
  build_if_missing: false    # los folds los deja scripts/build_dataset.py, sobre dev
  strict: true
  # Tiene que decir lo mismo que el splits.json congelado: los folds salen del
  # archivo, así que si esto no coincide, train.py falla en vez de entrenar una
  # corrida distinta de la que el YAML describe. Se regenera con
  # `python scripts/make_splits.py --config configs/data/panel_v1.yaml`.
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5     # guarda dura: filas label=1 por fold en validación
  n_repeats: 1               # CV repetida: R pasadas con semillas distintas
  # Holdout dev/test congelado (regla 2): la CV corre solo sobre dev.
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: baserate
  params: {}

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-baselines
  job_type: train
  tags: [f3, baseline, panel-v1]
  mode: online
  log_artifacts: false

output_dir: experiments
