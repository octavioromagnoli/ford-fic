# ¿Qué agrega entrenar con los autos de fuera de la ventana de producción? (26-09-2026)
#
#   python scripts/audit_vehicle_strata.py --config configs/audit_vehicle_strata_v2.yaml
#
# Las mismas cinco corridas sobre los dos universos de la entrega v2: con la ventana
# (exp_v2_ventana_*, 557 autos) y sin ella (exp_v2_*, 990, el vigente). El AUC por vehículo
# se mide agrupado, dentro del mercado y dentro de mercado × motor, sobre todos los autos de
# dev de cada corrida y solo sobre los autos de dev de la ventana (los mismos 446 en las dos).
vehicle_table: ${DATA_DIR}/processed/vehicles.parquet
experiments_dir: ${REPO_ROOT}/experiments

subsets:
  todos: null
  ventana: ${DATA_DIR}/processed/test_split_ventana.json   # sus dev_vehicles

strata:
  agrupado: []
  mercado: [static_SalesCountry_cd]
  mercado_motor: [static_SalesCountry_cd, static_Engine]

runs:
  - f9-v2-ventana-lgbm-r3
  - f9-v2-ventana-ss-r3
  - f9-v2-ventana-ss-hfull-r3
  - f9-v2-ventana-ss-hfull-r3-estaticas
  - f9-v2-lgbm-r3
  - f9-v2-ss-r3
  - f9-v2-ss-hfull-r3
  - f9-v2-ss-hfull-r3-estaticas

output: ${REPO_ROOT}/experiments/audit_vehicle_strata_v2.csv
