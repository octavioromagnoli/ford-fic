# F3 · panel con EVENTO FICTICIO + VENTANA DE RIESGO: los dos grupos aportan los
# mismos cortes relativos, así que la posición en la serie deja de ser la etiqueta
# (P = 0,49 contra 0,84 del v1). Tasa base 0,56: el PR-AUC NO se compara con el de
# los otros paneles, lo comparable es el ROC y el lift.
name: f3-logistic-pseudo
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_pseudo.parquet

splits:
  path: ${DATA_DIR}/processed/splits_pseudo.json
  n_splits: 5
  seed: 42
  build_if_missing: false    # los folds los deja scripts/build_dataset.py, sobre dev
  strict: true
  # Tiene que decir lo mismo que el splits.json congelado: los folds salen del
  # archivo, así que si esto no coincide, train.py falla en vez de entrenar una
  # corrida distinta de la que el YAML describe. Se regenera con
  # `python scripts/make_splits.py --config configs/data/panel_v1.yaml`.
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5     # guarda dura: filas label=1 por fold en validación
  n_repeats: 1               # CV repetida: R pasadas con semillas distintas
  # Holdout dev/test congelado (regla 2): la CV corre solo sobre dev.
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: logistic
  params:
    C: 0.1


eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-modelos
  job_type: train
  tags: [f3, modelo, panel-pseudo]
  mode: online
  log_artifacts: false

output_dir: experiments
