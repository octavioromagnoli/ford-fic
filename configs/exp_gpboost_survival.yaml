# F3 · El mismo apilado de supervivencia, con un intercept aleatorio por vehículo.
#
# Idéntico a configs/exp_survival_stacking.yaml salvo `model.name`: mismo panel, mismas
# filas, mismos folds, mismo objetivo, mismos bins. La diferencia de PR-AUC entre los
# dos es lo que aporta el efecto aleatorio y nada más.
#
# Los ~5 cortes de un vehículo comparten auto, conductor y ruta: tratarlos como
# independientes es la trampa que docs/f3-modelos-candidatos.md §2.1 anota para el Cox
# por fila. GPBoost (Sigrist) mete el nivel del vehículo en un efecto aleatorio para que
# los árboles se queden con lo que cambia **dentro** del vehículo, que es donde el EDA
# dice que está la señal (ICC 0,3–0,6).
#
# El vehículo de validación nunca está en train (split agrupado, regla 2), así que su
# efecto aleatorio es la media a priori: no ayuda por la puerta de atrás, regulariza al
# entrenar. Por eso el número sigue siendo comparable.
#
#   uv pip install -r requirements-gpboost.txt
#   python scripts/build_survival_panel.py --config configs/data/panel_survival.yaml
#   python scripts/train.py --config configs/exp_gpboost_survival.yaml
name: f3-gpboost-survival
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_survival.parquet

splits:
  path: ${DATA_DIR}/processed/splits.json
  n_splits: 5
  seed: 42
  build_if_missing: false
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 1
  test_split: ${DATA_DIR}/processed/test_split.json

target:
  name: discrete_survival
  params: {}

model:
  name: gpboost_survival
  params:
    horizon_km: 3000
    bin_km: 500
    max_horizon_km: 6000
    random_state: 42
    gp_params:
      likelihood: bernoulli_logit   # el hazard discreto es una Bernoulli por bin

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50
  bootstrap_by_vehicle: true
  bootstrap_n_boot: 1000

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-survival
  job_type: train
  tags: [f3, survival, stacking, gpboost, panel-v1]
  mode: online
  log_artifacts: false

output_dir: experiments
