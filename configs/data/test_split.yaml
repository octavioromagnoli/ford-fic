# Holdout dev/test VIGENTE de la entrega v2 (26-09-2026): los 557 vehículos producidos entre
# el 20-01 y el 31-07-2025, el período donde se muestrearon las dos cohortes (446 dev / 111 test).
#
#   python scripts/make_test_split.py --config configs/data/test_split.yaml --force
#
# El 26-09 se probó sacar la ventana (990 vehículos, configs/data/test_split_sinventana.yaml,
# que extiende este archivo sin mover a nadie): los modelos ordenan peor a estos mismos autos y
# la fecha de producción sola pasa a separar las cohortes. Se volvió a la ventana; la evidencia
# está en docs/memoria/f9-universo-v2.md §6.
#
# El de la entrega 1 (290 dev / 74 test, sorteado el 16-09 y recortado el 17-09) está
# congelado en data/processed-v1/test_split.json y se reproduce bit a bit con
# configs/data/test_split_v1.yaml. El porqué de cada clave de abajo:
# docs/memoria/f9-universo-v2.md.
#
# Congelado el archivo, no se regenera: cambiar la semilla, el test_size o los estratos
# después de haber medido contra el test es elegir el test que mejor queda.
seed: 42                  # la misma semilla de la entrega 1
test_size: 0.2            # 1/5: un fold de StratifiedGroupKFold (ver src/eval/splits.py)

sources: configs/data/raw_sources.yaml
dedupe: configs/data/vehicle_dedupe.yaml    # los mismos 13 pares (en v2, 7 siguen en fallados, con historia idéntica)
panel: configs/data/panel_v1.yaml           # de acá salen las columnas static_*
extra_static_columns: [SalesCity]           # nueva en v2; se reporta, no se estratifica

group_column: vehicle_id                    # regla 2: ningún vehículo en los dos lados
event_column: event_observed                # IdentificationDate no nula

# Universo del estudio: qué vehículo entra, ANTES de sortear (src/data/usable.py).
universe:
  # En v2 ningún fallado tiene IdentificationDate == daysUntilSale (0 de 298 filas):
  # Ford sacó a los 278 que la tenían. El criterio queda por si vuelve a aparecer.
  require_usable_event_date: true

  # Los cinco mercados tienen eventos fechados y sanos. PRY tiene 1 fallado y 0 sanos
  # (y es un auto de 2024, fuera de la ventana de abajo). PER no tiene fallados dentro
  # de la ventana, pero registra eventos fechados (2, de autos de 2024): un sano de PER
  # es un negativo en un mercado donde el evento se puede ver, así que entra.
  keep_markets: [ARG, BRA, CHL, COL, PER]

  # Período de producción donde las DOS cohortes se muestrearon, en ProductionDay
  # (origen 2025-01-19, IQR 0 d sobre los 1019 autos con viajes): día 1 = 2025-01-20,
  # el primer sano; día 193 = 2025-07-31, el mes del último fallado (28-07). Afuera:
  #   - 93 fallados producidos entre ago-2024 y el 19-01-2025, sin ningún sano de su época;
  #   - 341 sanos producidos desde ago-2025, entre los que no figura ningún fallado aunque
  #     el hazard de los producidos en ene-jun 2025 predice ~50 (28 en ago-sep, 22 en
  #     oct-dic). Cero contra 50 no es exposición: sus fallas no están en la muestra.
  production_day_window: [1, 193]

# Sorteo en UNA etapa sobre el universo (holdout_on_universe), estratificado.
draw:
  mode: universe      # `on:` no: YAML lo lee como booleano
  # El estrato es evento × mercado × motor, fundiendo hacia arriba los de menos de
  # 5 autos (src/eval/splits.py::composite_strata). En v2 el riesgo cambia 8× entre
  # mercados y ENG_3 falla casi solo en Brasil (46 de 47 fallados ENG_3 del universo):
  # estratificando solo por evento, un lado se puede quedar con los ENG_3 fallados.
  stratify: [event_observed, static_SalesCountry_cd, static_Engine]
  min_stratum_size: 5

# Con qué holdout se compara el nuevo: cuántos autos cambian de lado, y cuáles del
# test nuevo estaban en el dev viejo (se miraron durante F3-F8). La lista queda en el
# JSON para reportar el test final también sin ellos.
previous_holdout: ${DATA_DIR}/processed-v1/test_split.json

# Columnas cuyo balance se REPORTA entre dev y test (las dos primeras también estratifican).
balance_columns: [static_Engine, static_SalesCountry_cd, static_ModelSeries]

scan:
  chunksize: 500000       # signals son 10M de filas: se leen por chunks

output:
  test_split: ${DATA_DIR}/processed/test_split.json
  vehicle_table: ${DATA_DIR}/processed/vehicles.parquet   # unión a nivel vehículo (insumo de F2)
  quality: ${DATA_DIR}/processed/raw_quality.csv          # nulos y tipos por columna
