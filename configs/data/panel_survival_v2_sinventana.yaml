# VARIANTE SIN LA VENTANA DE PRODUCCIÓN (universo de 990, holdout test_split_sinventana.json).
# No es el universo vigente (ese es el de la ventana, 557): se conserva como evidencia de por
# qué no se usa para elegir ni medir modelos. Ver docs/reproducibilidad.md
#
# Panel v2 + `feat_cut_odo` (el odómetro del corte como covariable del hazard base), igual
# que configs/data/panel_survival.yaml hacía sobre el panel v1. Mismas filas ⇒ mismos folds.
#
#   python scripts/build_survival_panel.py --config configs/data/panel_survival_v2_sinventana.yaml
panel_config: configs/data/panel_v2_sinventana.yaml

columns:
  feat_cut_odo: cut_odo

output:
  panel: ${DATA_DIR}/processed/panel_survival_sinventana.parquet
