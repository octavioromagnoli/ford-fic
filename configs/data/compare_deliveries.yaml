# Comparación de la entrega 1 (15-09-2026) contra la v2 (24-09, recibida el 26-09).
#
#   python scripts/compare_deliveries.py --config configs/data/compare_deliveries.yaml
#
# Audita archivos, esquema, códigos, etiquetas, fechas y telemetría de las dos entregas.
# Todo lo que usa la etiqueta es a nivel vehículo (quién es fallado, cuándo, de qué
# producción), como la tabla de mercados de la entrega 1. Lo único que mira telemetría
# alrededor del evento (§6, qué marca la fecha nueva) excluye a los autos de test.
# Lectura: docs/memoria/f9-entrega-v2.md.

sources_v1: configs/data/raw_sources_v1.yaml
sources_v2: configs/data/raw_sources.yaml
dedupe: configs/data/vehicle_dedupe.yaml
raw_dirs: {v1: "${DATA_DIR}/old_raw", v2: "${DATA_DIR}/raw"}
test_split: ${DATA_DIR}/processed/test_split.json          # para excluir test de §6
test_split_v1: ${DATA_DIR}/processed-v1/test_split.json

origin_date: "2025-01-19"            # anchor (IQR 0 d); se re-verifica en §3
production_offset_failed_v2: -538    # el que declara raw_sources.yaml; se re-verifica en §3
extraction_end: "2026-09-14"

# §5 · ¿el corte de producción es exposición o selección?
production_test:
  reference_window: ["2025-01-20", "2025-06-30"]   # hazard por días desde la venta estimado acá
  late_windows:
    jul-2025: ["2025-07-01", "2025-07-31"]
    ago-sep-2025: ["2025-08-01", "2025-09-30"]
    oct-dic-2025: ["2025-10-01", "2025-12-31"]
  dss_bins: [0, 60, 120, 180, 240, 300, 360, 450, 540, 720]

# §6 · qué marca la fecha v2 (firmas de servicio alrededor de v1 y v2)
signatures:
  oil_reset_points: 30        # EngineOilLifePCStart − fin del viaje anterior >= 30 => cambio de aceite
  bins_days: [-61, -45, -30, -21, -14, -7, -3, 0, 3, 7, 14, 30]
  bad_messages: ["Air Filter Overloaded", "Air Filter Over Limit"]

output_dir: ${REPO_ROOT}/experiments/entregas
