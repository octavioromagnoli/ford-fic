# Panel de hitos post-venta (Fase 3 del cure model). Una fila por (vehículo, hito L días
# después de la venta).
#
#   python scripts/build_landmark_panel.py --config configs/data/panel_landmark_ps.yaml
#
# Cada valor de acá está preregistrado en docs/memoria/f3-preregistro-cure.md §1–§3. Para
# cambiar uno, primero se commitea el cambio en el preregistro (y por qué), después acá.
seed: 42

sources: configs/data/raw_sources.yaml
dedupe: configs/data/vehicle_dedupe.yaml
# Estáticas (`load_vehicle_static` las renombra a `static_*` según este YAML).
panel_config: configs/data/panel_v1.yaml
# Definiciones de las features (columna + agregador) y umbrales/topes de `derive_trip_columns`.
features_spec: configs/data/features_v1.yaml

# Universo + holdout congelado: el panel se construye con los 364 (dev + test); los terciles
# de producción y el origen del calendario se estiman solo con dev.
test_split: ${DATA_DIR}/processed/test_split.json
# Origen del calendario congelado en F2. Se re-estima sobre dev y falla si no coincide.
anchor_meta: ${DATA_DIR}/processed/panel_meta.json
# Ventana del registro de eventos (`event_window`), congelada en la Fase 1. Se lee de ahí
# para que haya una sola fuente.
event_clock: configs/data/event_clock.yaml

landmark:
  landmarks_days: [30, 60, 90]   # L, días desde la venta
  gap_days: 30                    # G: ≈ 1.700 km al km/día mediano (57); G = 500 km del panel v1 son ≈ 9 d
  horizon_days: 240               # H: cubre la latencia observada (máximo 268 d post-venta)
  min_trips: 15                   # viajes post-venta mínimos en (venta, venta + L]

# Negativo resuelto (D2): sano con exposición en la ventana ≥ e_min_days, medida desde
# max(venta + from_landmark_days + G, inicio de la ventana) hasta el fin de la ventana.
# Es una propiedad del vehículo: es la misma en sus tres hitos.
resolved_negative:
  from_landmark_days: 30
  e_min_days: 90
  sensitivity_days: [60, 120]

# Terciles de `ProductionDay` sobre los vehículos de dev (estratos del nulo C1 y de C2).
production_terciles: 3

# Las cuatro features del índice físico (docs/f3-modelos-candidatos.md §1.1). `column` y
# `agg` salen de `features_spec`: acá solo va el peso de la celda (vehículo × mes) y su
# mínimo. Bajo el mínimo el valor del mes queda en NaN (el peso se conserva). El signo de
# cada una es de P0 y va en su YAML de experimento, no acá.
fleet_features:
  - {name: idle_per_1000km,              weight: km,      min_weight: 100}
  - {name: trips_below_regime_temp_frac, weight: n_valid, min_weight: 5}
  - {name: speed_kmh_mean,               weight: n_valid, min_weight: 5}
  - {name: coolant_temp_end_mean,        weight: n_valid, min_weight: 5}

# Estáticas que entran por prefijo. `SalesCountry_cd` solo sirve para armar la celda de la
# referencia de flota (mercado × mes); el normalizador la consume.
static_columns: [SalesCountry_cd]
# Estáticas que viajan como `aux_static_*`, fuera del modelo (auditorías A3 y C2).
aux_static: [ProductionDay, daysUntilSale, ModelSeries, Engine]

scan:
  chunksize: 500000

# Los viajes derivados del universo se cachean (leer los crudos lleva minutos). `--refresh`
# los vuelve a leer.
trips_cache: ${DATA_DIR}/interim/landmark_trips.parquet

output:
  panel: ${DATA_DIR}/processed/panel_landmark_ps.parquet
  meta: ${DATA_DIR}/processed/panel_landmark_ps_meta.json
