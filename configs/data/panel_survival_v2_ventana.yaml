# VARIANTE CON LA VENTANA DE PRODUCCIÓN (universo de 557, holdout test_split_ventana.json).
# Se conserva para comparar contra el universo vigente sin ventana (990): ver
# docs/memoria/f9-universo-v2.md y f9-remedicion-v2.md.
#
# Panel v2 + `feat_cut_odo` (el odómetro del corte como covariable del hazard base), igual
# que configs/data/panel_survival.yaml hacía sobre el panel v1. Mismas filas ⇒ mismos folds.
#
#   python scripts/build_survival_panel.py --config configs/data/panel_survival_v2_ventana.yaml
panel_config: configs/data/panel_v2_ventana.yaml

columns:
  feat_cut_odo: cut_odo

output:
  panel: ${DATA_DIR}/processed/panel_survival_ventana.parquet
