# Config del panel REAL (F2).
#
#   python scripts/build_dataset.py --config configs/data/panel_v1.yaml
#
# Los valores de W, G, H y Δ salen de la factibilidad medida sobre dev
# (`python scripts/eda_gaps.py`, bloque 1) y del perfil alineado al evento; el
# porqué de cada uno está en docs/memoria/decisiones.md (2026-09-18) y en
# docs/memoria/f2-eda-revision-y-features.md. Para probar otra terna se escribe
# otro YAML (regla 7), no se edita este.
seed: 42

sources: configs/data/raw_sources.yaml
dedupe: configs/data/vehicle_dedupe.yaml   # 13 vehículos duplicados bajo dos códigos (F1)

# Universo + holdout congelado. El panel se construye con los 364 del universo (dev +
# test); los 717 excluidos no entran. `dev_vehicles` es además la referencia para
# estimar el origen del calendario y la distribución de cortes de los sanos: el test
# no se mira ni en agregado.
test_split: ${DATA_DIR}/processed/test_split.json

axis: odometer            # eje por defecto (plan §0.3). El evento se traduce a km con el anclaje de F1.

label:
  window_km: 1000         # W · ventana móvil hacia atrás sobre la que se agregan las features
  gap_km: 500             # G · blanking. Sin esto el modelo detecta en vez de anticipar
  horizon_km: 3000        # H · el evento cuenta si cae en [corte+G, corte+G+H]
  cut_step_km: 500        # Δ · cada cuántos km se genera un punto de corte (grilla de múltiplos)
  # Sanos: un corte solo es un negativo verificable si el vehículo se observó hasta
  # corte+G+H. `drop` los descarta; `keep_as_negative` los deja como 0 asumiendo que
  # no hubo evento (más filas, etiqueta con ruido).
  censored_policy: drop
  # Control de calidad de la ventana: filas con menos viajes, o que cubren menos de
  # esta fracción de W en km recorridos, se descartan (huecos de registro).
  min_trips_in_window: 5
  min_km_covered_frac: 0.5

sampling:
  # Los cortes de vehículos sanos se muestrean con la MISMA distribución que los
  # positivos de dev (plan §9), sobre el odómetro Y sobre el mes del corte: los 60
  # eventos de dev caen entre sep-2025 y mar-2026 mientras la exposición sana se
  # concentra en 2026, así que emparejar solo por odómetro deja el calendario como
  # atajo (ver `Regenerations`, que se corta el 25-05-2026). Se conserva el mayor
  # subconjunto de filas sanas que reproduce esa distribución conjunta.
  # Celdas de 4.000 km × mes y hasta un 25% de déficit: con celdas más finas (2.000 km
  # × mes, 10%) quedan 682 filas sanas de 7.308; con odómetro solo quedan 4.916 pero la
  # distribución de meses no se parece en nada (distancia TV 0,57) y el atajo sigue abierto.
  match_healthy_cut_distribution: true
  match_on: [cut_odo, cut_date]
  odo_bin_km: 4000
  date_freq: M
  max_shortfall: 0.25

features:
  spec: configs/data/features_v1.yaml
  # Familias del plan §4. Cada entrada del spec se traduce a una columna feat_* con
  # la primitiva de src/features/windows.py: (columna derivada, agregador).
  enabled_families: [A_thermal, B_regeneration, C_usage, D_severity]

  # Estáticas que SÍ entran como `static_*`.
  #   - SalesCountry_cd: dos mercados (CNTRY_3/CNTRY_4) que miden parecido pero con
  #     distinto nivel; el modelo necesita verlo para no confundir nivel con síntoma.
  static_columns: [SalesCountry_cd]

  # Fuera del set base (quedan en el panel como `aux_static_*`, para ablaciones):
  #   - Engine: ENG_3 es el 0% de los fallados y el 20% de los sanos de dev (F1).
  #   - ModelSeries: el cruce Engine × ModelSeries es casi diagonal; MODEL_3 tiene 0
  #     eventos de 24 y MODEL_4 2 de 91. Sacar Engine y dejar ModelSeries renombra el sesgo.
  #   - ProductionDay: ρ = −0,435 con la etiqueta y −0,933 con span_days. Es la
  #     ventana de observación (los producidos tarde no llegaron a fallar), no física.
  #   - daysUntilSale: el mismo sesgo por otra vía. La fecha de venta
  #     (ProductionDay + daysUntilSale) da ρ = −0,48 con la etiqueta y la tasa de
  #     eventos por quintil va de 0,53 a 0,00: un vehículo vendido tarde no llegó a
  #     acumular km antes del corte de los datos. Con W/G/H fijos, un modelo que la use
  #     aprende cuándo se vendió el auto, no cómo se usa.
  static_excluded: [Engine, ModelSeries, ProductionDay, daysUntilSale]

splits:
  n_splits: 5
  seed: 42

output:
  panel: ${DATA_DIR}/processed/panel.parquet
  splits: ${DATA_DIR}/processed/splits.json
  meta: ${DATA_DIR}/processed/panel_meta.json

# Publicación como wandb Artifacts (plan §4): `python scripts/log_panel_artifact.py`.
# Mismo team y proyecto que las corridas (regla 9); `WANDB_ENTITY`/`WANDB_MODE` lo pisan.
wandb:
  project: ford-fic
  entity: oromagnoli-
  artifact: panel-v1            # tipo `dataset`: panel.parquet + splits.json + panel_meta.json + YAMLs
  holdout_artifact: test-split  # tipo `holdout`: test_split.json
  group: f2-panel
  tags: [f2, panel-v1]
