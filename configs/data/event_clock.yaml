  h1_sdlog_age: 0.24
  h1_sdlog_odometer: 0.97
  h1_n_failed: 57
  h1_diff_odometer_minus_days: 0.72
  h1_dss_median: 163
  h1_dss_iqr: [105, 204]
  h1_dss_max: 268
  h2_n: 47
  h2_rho_kmday_km: 0.48
  h2_rho_kmday_days: -0.06
  h3_first_event: "2025-09-03"
  h3_last_event: "2026-03-11"
  h4_presale_car_months: 748
  h4_dss_rates: [0.0, 1.5, 6.5, 6.5, 16.1, 18.5]
  h4_age_rates: [0.4, 3.0, 4.7, 9.9, 15.1]
  h5_idle_far_near: [0.28, 0.13]
  h5_below_far_near: [0.39, 0.04]
  h6_auc_below_30: 0.68
  h6_null_auc: 0.645
  h6_null_p: 0.0005
  h6_detection: ["4/42", "3/55", "2/47"]
  h9_inside: 0.72
