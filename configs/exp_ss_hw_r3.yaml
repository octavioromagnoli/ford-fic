# F6 · K2: survival stacking en km con horizonte completo y el conjunto en riesgo de la ventana
#
# Preregistro: docs/memoria/f6-preregistro-deteccion-vehiculo.md (K2). Es
# `configs/exp_survival_stacking_r3.yaml` con dos cambios y nada más:
#   - el target: `window_km_survival` en vez de `discrete_survival` (entrada tardía en el
#     odómetro del 01-09-2025; un sano sale en min(último odómetro, odómetro del 11-03-2026));
#   - `max_horizon_km: 55000`, el menor múltiplo de 5.000 km que no censura ningún tramo de dev
#     (embudo: salida máxima 52.210 km).
# Mismas filas, mismas features (53 feat_ + static_SalesCountry_cd + feat_cut_odo), mismos folds,
# mismo booster y el mismo score (1 − S(3.000 km | x)).
#
#   FORD_DATA_DIR=$PWD/data/rebuild-0921 WANDB_MODE=disabled python scripts/train.py --config configs/exp_ss_hw_r3.yaml
name: f6-ss-hw-r3
seed: 42

data:
  # El panel del finalista + las aux_ de la ventana en km (scripts/build_km_window_panel.py).
  panel: ${DATA_DIR}/processed/panel_survival_kmw.parquet

splits:
  path: ${DATA_DIR}/processed/splits_r3.json
  n_splits: 5
  seed: 42
  build_if_missing: false
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 3
  test_split: ${DATA_DIR}/processed/test_split.json

target:
  name: window_km_survival   # lee aux_risk_entry_km / aux_risk_exit_km / aux_risk_event_km
  params: {}

model:
  name: survival_stacking
  params:
    horizon_km: 3000         # el score sigue siendo el riesgo a H del panel
    bin_km: 500
    max_horizon_km: 55000    # <- horizonte completo (preregistro, §0)
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50
  bootstrap_by_vehicle: true
  bootstrap_n_boot: 1000

# scripts/eval_window_label.py: V decide (§3 del preregistro), contra la referencia sin reentrenar.
window_eval:
  reference: f3-survival-stacking-r3-rebuild
  evaluable_column: aux_eval_in_window
  decides: corrected
  floors: [cut_odo, aux_cut_dss]
  a0_tolerance: 0.02

# scripts/audit_detection_null.py (§4): nulo de tamaño de bolsa y bootstrap pareado (informativo).
detection_null:
  n_permutations: 200
  seed: 0
  n_boot: 1000

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f6-deteccion
  job_type: train
  tags: [f6, survival, stacking, ventana, horizonte-completo, r3]
  mode: online
  log_artifacts: false

output_dir: experiments
