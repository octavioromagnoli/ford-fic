# F3 · Target ordinal con bins EXTENDIDOS más allá de la ventana positiva.
#
# La variante previa (`configs/exp_ordinal_horizon.yaml`) partía [G, G+H] = [500, 3500]
# en cuatro buckets. Ese intervalo es exactamente el que ya era `label = 1`, así que el
# target resultaba un refinamiento estricto adentro de la clase positiva: no decía nada
# de las 1.775 filas negativas (87% del panel) y en particular no distinguía "vehículo
# sano" de "vehículo que falla dentro de 8.000 km". Midió el costo de varianza de partir
# 254 positivas en cuatro baldes de ~60 sin el beneficio de información.
#
# Acá los cortes se extienden a 6.000 y 10.000 km, como en SCANIA Component X
# (arXiv:2401.15199), donde la clase 0 significa "lejos del fallo" y no "sano". Las
# clases 1 y 2 se llenan con 394 filas que hoy son `label = 0` pero vienen de vehículos
# que fallan: ésa es la información nueva. `score_max_tte_km` sigue en 3.500 = G + H, así
# que el score comparable P(clase >= 3) reconstruye P(label = 1) exactamente.
#
# El riesgo que esto abre está medido, no supuesto: al extender los bins la tarea
# auxiliar se parece cada vez más a "identificar la cohorte de muestreo", y la cohorte
# ES la etiqueta (CLAUDE.md). `scripts/audit_ordinal_horizon.py` corre las tres
# auditorías obligatorias del plan y `target_report.class_0` deja registrado cuántas
# filas de clase 0 vienen igual de vehículos con evento.
#
#   FORD_DATA_DIR=data/v364 python scripts/train.py --config configs/exp_ordinal_horizon_ext.yaml
#   python scripts/audit_ordinal_horizon.py --config configs/exp_ordinal_horizon_ext.yaml
name: f3-ordinal-horizon-ext
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel.parquet

splits:
  path: ${DATA_DIR}/processed/splits.json
  n_splits: 5
  seed: 42
  build_if_missing: false
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 1
  test_split: ${DATA_DIR}/processed/test_split.json

target:
  name: ordinal_horizon
  params:
    # Clase 0 = censurado o evento a más de 10.000 km; 1 = (6.000, 10.000];
    # 2 = (3.500, 6.000]; 3 = (2.000, 3.500]; 4 = [500, 2.000].
    # Reparto en dev: 1.381 / 224 / 170 / 118 / 136 filas. Justificación de los
    # cortes contra el histograma real: docs/reproducibilidad.md
    bins_km: [2000, 3500, 6000, 10000]
    # P(label=1) = P(time_to_event_km <= G+H) = P(clase >= 3). El corte 3.500 tiene
    # que estar en `bins_km` o el score deja de ser comparable con el control.
    score_max_tte_km: 3500

model:
  name: lgbm_ordinal
  params:
    objective: multiclass
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 7
    min_child_samples: 40
    reg_lambda: 5.0
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.7
    class_weight: balanced
    random_state: 42
    verbose: -1

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50
  # Sin `cost_matrix`: una matriz única es degenerada a esta tasa base. Con p = 0,125,
  # alertar siempre le gana a no alertar nunca en cuanto C_FN/C_FP > (1-p)/p ≈ 7, así
  # que con los 20–50× de SCANIA la política óptima es "revisar todo" sin importar el
  # modelo. Además esa matriz es para una rotura en ruta de un camión pesado; acá el
  # evento es degradación de eficiencia y no inmoviliza a nadie. Se barre el ratio y se
  # reporta el punto de quiebre. Es reporte: la selección sigue siendo PR-AUC OOF.
  cost_ratios: [2, 3, 5, 7, 10, 20, 50]
  cost_fp: 1.0
  # Solo `mean`: `max`, `topk` y `noisy_or` están confundidas con el tamaño de la bolsa
  # en el panel v1 (docs/reproducibilidad.md).
  vehicle_aggregation: [mean]

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-target-reformulation
  job_type: train
  tags: [f3, lgbm, ordinal, multi-horizon, extended-bins, panel-v1]
  mode: online
  log_artifacts: false

output_dir: experiments
