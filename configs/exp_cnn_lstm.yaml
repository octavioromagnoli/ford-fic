# F3 · baseline de la tutora: CNN-LSTM con una rama dinámica (secuencia de `signals`)
# y una rama estática (`static_*`) que se une después de la LSTM.
# Interpretación y arquitectura: src/models/cnn_lstm.py.
#
#   python scripts/build_seq_panel.py --config configs/data/panel_seq_v1.yaml   # una vez
#   python scripts/train.py --config configs/exp_cnn_lstm.yaml
#
# Necesita PyTorch (opcional): `uv pip install -r requirements-dl.txt`.
#
# El panel secuencial tiene las mismas filas que el panel v1, así que los folds son los
# mismos y el número se compara directo contra `exp_baserate.yaml`.
name: f3-cnn-lstm-tutora
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_seq_v1.parquet

splits:
  path: ${DATA_DIR}/processed/splits.json    # los del panel v1: misma huella
  n_splits: 5
  seed: 42
  build_if_missing: false
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 1
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: cnn_lstm
  params:
    # Forma del tensor (T bins × C canales): la escribe el builder del panel secuencial.
    sequence_meta: ${DATA_DIR}/processed/panel_seq_v1_meta.json
    # Rama dinámica
    conv_channels: 16
    kernel_size: 3          # 3 bins = 150 km de contexto local por filtro
    lstm_hidden: 16
    # Rama estática (hoy solo el one-hot de SalesCountry_cd)
    static_hidden: 4
    # Cabeza después de la fusión
    head_hidden: 16
    dropout: 0.3
    # Entrenamiento: épocas fijas, sin early stopping (ver docstring del modelo)
    epochs: 40
    batch_size: 64
    learning_rate: 0.001
    weight_decay: 0.0001
    grad_clip: 1.0
    class_weight: balanced  # pos_weight = negativos/positivos del train del fold
    device: cpu             # determinista; `mps` anda pero no hace falta con este tamaño
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-secuenciales
  job_type: train
  tags: [f3, cnn-lstm, tutora, panel-seq-v1]
  mode: online
  log_artifacts: false

output_dir: experiments
