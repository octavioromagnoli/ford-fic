# F0 · corrida end-to-end contra el panel dummy.
# Es el test de que el harness funciona, no un resultado: el modelo es la tasa
# base sobre features aleatorias, así que las métricas TIENEN que dar basura.
name: f0-dummy-baserate
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_dummy.parquet

splits:
  path: ${DATA_DIR}/processed/splits_dummy.json
  n_splits: 5
  seed: 42
  build_if_missing: true   # solo en dummy; contra el panel real esto va en false
  strict: true             # falla si los splits no corresponden a este panel

model:
  name: baserate           # ver src/models/registry.py
  params: {}

eval:
  k_consecutive: 2               # alerta sostenida: K cortes seguidos sobre el umbral
  n_thresholds: 50
  max_false_alarms_per_1000: 50  # presupuesto de falsas alarmas del punto de operación

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-      # team compartido; override local con WANDB_ENTITY
  group: f0-infra
  job_type: train
  tags: [f0, dummy, smoke-test]
  mode: online             # sin red: WANDB_MODE=offline y después `wandb sync`
  log_artifacts: false

output_dir: experiments
