# F3 · E2, componente 1: survival stacking con bagging por vehículo (10 bolsas), R=3
#
# Preregistro: docs/reproducibilidad.md, E2 (commit 9b7bfb4).
# Es `configs/exp_survival_stacking_r3.yaml` envuelto en `vehicle_bagging`: mismo panel,
# mismos folds, mismo target, y los hiperparámetros internos **sin cambios**. Lo único que
# se agrega es promediar 10 bootstraps de vehículos del train de cada fold.
#
# Es un COMPONENTE de E2, no un candidato: no puede quedar como finalista por su cuenta.
#
#   python scripts/train.py --config configs/exp_survival_stacking_r3_bag10.yaml
name: f3-survival-stacking-r3-bag10
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_survival.parquet

splits:
  path: ${DATA_DIR}/processed/splits_r3.json
  n_splits: 5
  seed: 42
  build_if_missing: false
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 3
  test_split: ${DATA_DIR}/processed/test_split.json

target:
  name: discrete_survival    # trae el vehículo (`group`), que es lo que el bagging remuestrea
  params: {}

model:
  name: vehicle_bagging
  params:
    base_model: survival_stacking
    base_params:             # copia de exp_survival_stacking_r3.yaml, sin tocar
      horizon_km: 3000
      bin_km: 500
      max_horizon_km: 6000
      random_state: 42
    n_bags: 10               # preregistro E2
    random_state: 42         # sorteo de vehículos (preregistro E2: semilla 42)

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50
  bootstrap_by_vehicle: true
  bootstrap_n_boot: 1000

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-ensamble
  job_type: train
  tags: [f3, survival, stacking, bagging, e2, panel-v1, r3]
  mode: online
  log_artifacts: false

output_dir: experiments
