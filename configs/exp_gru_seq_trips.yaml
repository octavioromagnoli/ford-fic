# F3 · GRU sobre el panel secuencial de `signals` + `TripSummary`: la ablación de
# canales por familia del modelo secuencial.
#
# Idéntico a `exp_gru_seq.yaml` salvo el panel (`panel_seq_trips.parquet`, 15 canales
# en vez de 9) y el `sequence_meta` que le corresponde: mismas filas, mismos folds,
# mismos hiperparámetros, misma semilla. La diferencia de PR-AUC es lo que aportan los
# 6 canales de `trips` —idle, régimen térmico, velocidad, distancia y duración por
# viaje—, que es lo que el EDA marcó como lo que más anticipa y que el panel secuencial
# de la tutora deja afuera (`configs/data/panel_seq_trips.yaml` explica el resto).
#
#   python scripts/build_seq_panel.py --config configs/data/panel_seq_trips.yaml   # una vez
#   python scripts/make_splits.py --config configs/data/splits_panel_v1_r3.yaml # una vez
#   python scripts/train.py --config configs/exp_gru_seq_trips.yaml
#
# Necesita PyTorch (opcional): `uv pip install -r requirements-dl.txt`.
name: f3-gru-seq-trips
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_seq_trips.parquet

splits:
  # Los folds del panel v1 con R = 3 (el panel secuencial tiene las mismas filas, así
  # que la huella coincide). La repetición 0 son exactamente los folds de `splits.json`:
  # el número de R=1 de las corridas viejas sigue siendo comparable, y las otras dos
  # repeticiones dicen cuánto de la diferencia entre modelos es el sorteo de folds.
  path: ${DATA_DIR}/processed/splits_r3.json
  n_splits: 5
  seed: 42
  build_if_missing: false
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 3
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: gru_seq
  params:
    # Forma del tensor (T bins × C canales) y geometría de la ventana (L, bin_km):
    # las escribe el builder del panel secuencial. Nada de esto se hardcodea.
    sequence_meta: ${DATA_DIR}/processed/panel_seq_trips_meta.json
    # Rama dinámica
    pooling: attention      # `last` reproduce a la CNN-LSTM; `mean` ignora el orden
    hidden: 24
    num_layers: 1
    attention_hidden: 16
    # Rama estática (hoy solo el one-hot de SalesCountry_cd); 0 la apaga
    static_hidden: 4
    # Cabeza después de la fusión
    head_hidden: 16
    dropout: 0.3
    # Entrenamiento: épocas fijas, sin early stopping (ver docstring del modelo)
    epochs: 40
    batch_size: 64
    learning_rate: 0.001
    weight_decay: 0.0001
    grad_clip: 1.0
    class_weight: balanced  # pos_weight = negativos/positivos del train del fold
    device: cpu
    # Una semilla no es un resultado: la media y el rango sobre >= 5 semillas salen de
    # `python scripts/seed_spread.py --config configs/exp_gru_seq_trips.yaml`.
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-secuenciales
  job_type: train
  tags: [f3, gru, panel-seq-trips, signals-trips]
  mode: online
  log_artifacts: false

output_dir: experiments
