# F3 · E2, componente 2: CNN-LSTM con bagging por vehículo (10 bolsas), R=3
#
# Preregistro: docs/reproducibilidad.md, E2 (commit 9b7bfb4).
# Es `configs/exp_cnn_lstm_r3.yaml` envuelto en `vehicle_bagging`: mismo panel secuencial,
# mismos folds, y los hiperparámetros de la red **sin cambios**. Lo único que se agrega
# es promediar 10 bootstraps de vehículos del train de cada fold.
#
# `target: grouped_label` no cambia con qué se entrena (la red recibe `label`): solo lleva
# el vehículo de cada fila hasta el envoltorio, que no lo puede sacar de la matriz
# preprocesada.
#
# Es un COMPONENTE de E2, no un candidato: no puede quedar como finalista por su cuenta.
#
#   python scripts/train.py --config configs/exp_cnn_lstm_r3_bag10.yaml
name: f3-cnn-lstm-r3-bag10
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_seq_v1.parquet

splits:
  path: ${DATA_DIR}/processed/splits_r3.json
  n_splits: 5
  seed: 42
  build_if_missing: false
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 3
  test_split: ${DATA_DIR}/processed/test_split.json

target:
  name: grouped_label
  params: {}

model:
  name: vehicle_bagging
  params:
    base_model: cnn_lstm
    base_params:             # copia de exp_cnn_lstm_r3.yaml, sin tocar
      sequence_meta: ${DATA_DIR}/processed/panel_seq_v1_meta.json
      conv_channels: 16
      kernel_size: 3
      lstm_hidden: 16
      static_hidden: 4
      head_hidden: 16
      dropout: 0.3
      epochs: 40
      batch_size: 64
      learning_rate: 0.001
      weight_decay: 0.0001
      grad_clip: 1.0
      class_weight: balanced
      device: cpu
      random_state: 42
    n_bags: 10               # preregistro E2
    random_state: 42         # sorteo de vehículos (preregistro E2: semilla 42)

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-ensamble
  job_type: train
  tags: [f3, cnn-lstm, bagging, e2, panel-seq-v1, r3, regen15]
  mode: online
  log_artifacts: false

output_dir: experiments
