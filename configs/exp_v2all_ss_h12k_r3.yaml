# Re-medición completa sobre la ENTREGA v2 (26-09-2026): survival stacking con horizonte de entrenamiento de 12.000 km (entre F3 y K2).
# Generado por scripts/make_v2all_configs.py desde configs/v2all_runs.yaml (no editar a mano).
#   WANDB_MODE=disabled python scripts/train.py --config configs/exp_v2all_ss_h12k_r3.yaml
name: v2all-ss-h12k-r3
seed: 42
data:
  panel: ${DATA_DIR}/processed/panel_survival.parquet
splits:
  path: ${DATA_DIR}/processed/splits_r3.json
  n_splits: 5
  seed: 42
  build_if_missing: false
  strict: true
  stratify:
    column: label
    level: vehicle
    extra_columns:
    - static_SalesCountry_cd
    - aux_static_Engine
    min_stratum_size: 5
  min_valid_positives: 5
  n_repeats: 3
  test_split: ${DATA_DIR}/processed/test_split.json
model:
  name: survival_stacking
  params:
    horizon_km: 3000
    bin_km: 500
    max_horizon_km: 12000
    random_state: 42
eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50
  bootstrap_by_vehicle: true
  bootstrap_n_boot: 1000
wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f9-v2all
  job_type: train
  tags:
  - f9
  - v2
  - v2all
  - r3
  mode: online
  log_artifacts: false
output_dir: experiments
target:
  name: discrete_survival
  params: {}
