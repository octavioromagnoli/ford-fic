# Capa de decisión sobre la GRU `last` de F3 con la etiqueta V (F9, el primer intento de la demo con la GRU).
# Es configs/exp_decision_k2.yaml con otra corrida y otra salida: no reentrena ni cambia el orden de los autos,
# dice DÓNDE se opera el score y cuánto se sostiene ese punto fuera de muestra (docs/reproducibilidad.md).
#
#   python scripts/decision_layer.py --config configs/exp_decision_gru_f3.yaml
#
# No es un candidato: todo lo que mide es monótono en el score de la GRU.
seed: 0

# La corrida de la GRU con la etiqueta V: de su YAML salen el panel, `eval` (k_consecutive, n_thresholds) y
# `window_eval` (la columna de V). Las predicciones se leen de experiments/<name>/.
run_config: configs/exp_gru_seq_last_kmw.yaml
# experiments/<output_name>/decision_layer.json (el default de decision_layer.py es el de K2).
output_name: decision-gru-f3

# Etiqueta que se reporta primero (V decide en todo el proyecto); D va como informativa.
labels: [corrected, hard]

# 1 · Curva: presupuestos de falsas alarmas por cada 1.000 sanos (2%, 5%, 10%, 20%), con la
# misma cuenta que train.py (grilla de n_thresholds cuantiles + operating_point).
budgets_per_1000: [20, 50, 100, 200]
# Nulo de tamaño de bolsa en cada presupuesto (regla 6): score permutado entre filas.
null_permutations: 200

# 2 · ¿Se sostiene el punto fuera de muestra? El umbral se fija con los sanos de los OTROS folds y se aplica al
# fold que queda afuera (empírico y Neyman-Pearson, como en K2).
alphas: [0.05, 0.10]
np_delta: 0.05
