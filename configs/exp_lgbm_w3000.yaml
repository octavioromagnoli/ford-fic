# F3 · BARRIDO DE VENTANA: el LightGBM chico de referencia sobre el panel de
# W = 3000 km, con los 53 agregados de siempre.
#
# Es el par de `exp_gru_seq_w3000.yaml`: mismo panel, mismos folds, misma semilla. La
# diferencia entre los dos, ventana por ventana, es lo que aporta ver la ventana en
# orden en vez de resumida.
#
#   python scripts/build_dataset.py --config configs/data/panel_w3000.yaml
#   python scripts/train.py --config configs/exp_lgbm_w3000.yaml
#
# La tasa base de este panel NO es la del panel v1: entre ventanas se comparan ROC-AUC
# y PR-AUC normalizado, nunca el PR-AUC crudo.
name: f3-lgbm-w3000
seed: 42

data:
  panel: ${DATA_DIR}/processed/panel_w3000.parquet

splits:
  path: ${DATA_DIR}/processed/splits_w3000.json
  n_splits: 5
  seed: 42
  build_if_missing: false    # los folds los deja scripts/build_dataset.py, sobre dev
  strict: true
  stratify:
    column: label
    level: vehicle
  min_valid_positives: 5
  n_repeats: 1
  test_split: ${DATA_DIR}/processed/test_split.json

model:
  name: lgbm                 # defaults del builder: docs/f3-modelos-candidatos.md §1.3
  params:
    random_state: 42

eval:
  k_consecutive: 2
  n_thresholds: 50
  max_false_alarms_per_1000: 50

wandb:
  enabled: true
  project: ford-fic
  entity: oromagnoli-
  group: f3-barrido-ventana
  job_type: train
  tags: [f3, lgbm, barrido-ventana, w3000]
  mode: online
  log_artifacts: false

output_dir: experiments
