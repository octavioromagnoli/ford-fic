run: f3-lgbm-panel-v1-mil
logged_on: '2026-09-20'
note: 'Mismo LightGBM y mismos folds que f3-lgbm-panel-v1: lo único que cambia es
  el eje de evaluación (agregación a nivel vehículo, MIL). Por vehículo el lift sube
  a 1,51x con `mean` (vs 1,32x por fila) y la detección a 15% (vs 9,4%) con el mismo
  presupuesto de falsas alarmas. `max`, `topk` y `noisy_or` dan más lift pero no le
  ganan a su propio nulo de permutación: es el tamaño de la bolsa (los que fallan
  conservan todos sus cortes, los sanos solo los emparejados). Detalle: docs/memoria/f3-mil-agregacion-vehiculo.md.
  Reanotada al agregarle el barrido de costo: paga a C_FN/C_FP ~7x (14,6% de ahorro
  sobre revisar todo) y por encima de 10x ahorra menos del 3%.'
