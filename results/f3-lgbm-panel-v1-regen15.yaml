run: f3-lgbm-panel-v1-regen15
logged_on: '2026-09-20'
note: 'El control de f3-lgbm-panel-v1 recorrido sobre el panel RECONSTRUIDO despues
  del umbral de regeneraciones de 15 puntos (commit 1eab4a1): el panel con el que
  se midio el 0,165 historico es anterior al arreglo. Mismo modelo, mismas filas,
  mismos folds: 0,1612. Es contra este numero, no contra el 0,165, que se comparan
  las corridas nuevas. Re-auditado con los criterios nuevos: (a0) 0,1251 vs tasa base
  0,1252 PASS, (a'') -0,0067 FALLA -> NO APROBADA. El orden dentro del vehiculo le
  resta: colapsar el score al promedio del vehiculo sube el PR-AUC de 0,1612 a 0,1679.
  Con R=3 se confirma: -0,0055 +/- 0,0040, negativo en las tres pasadas. No llega
  al techo de cohorte de 0,2627.


  [AUDITORIA · anotado al revisar los criterios] La auditoria (a) —permutar features

  dentro de cada vehiculo esperando que el PR-AUC cayera a la tasa base— NO es un
  null en

  este panel: deja intacto que vehiculos fallan, que es de donde sale casi todo el
  PR-AUC,

  y sube a 0,17-0,21. Cualquier lectura de esta corrida que la haya citado como aprobada

  paso un test que no mide timing. Los criterios ahora son (a0) y (a''); el piso es
  el

  techo de cohorte (0,2627 / lift 2,10x), no la tasa base.'
