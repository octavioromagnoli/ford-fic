  note: rama y commit del checkout donde se anotó, no necesariamente donde se entrenó
summary:
  model: cnn_lstm
  pr_auc: 0.15336756760323975
  pr_auc_lo: 0.14439761005533308
  pr_auc_hi: 0.21262360826795268
  base_rate: 0.1251848201084278
  lift: 1.2251291128621002
  roc_auc: 0.574490407008983
  brier: 0.23301925767238565
  detection_rate: 0.18867924528301888
  median_lead_km: 7739.717292725283
  budget: 50.0
  panel: ${DATA_DIR}/processed/panel_seq_v1.parquet
  splits: ${DATA_DIR}/processed/splits.json
  n_positive: 254
config:
  name: f3-cnn-lstm-tutora
  seed: 42
  data:
    panel: ${DATA_DIR}/processed/panel_seq_v1.parquet
  splits:
    path: ${DATA_DIR}/processed/splits.json
    n_splits: 5
    seed: 42
    build_if_missing: false
    strict: true
    stratify:
      column: label
      level: vehicle
    min_valid_positives: 5
    n_repeats: 1
    test_split: ${DATA_DIR}/processed/test_split.json
  model:
    name: cnn_lstm
    params:
      sequence_meta: ${DATA_DIR}/processed/panel_seq_v1_meta.json
      conv_channels: 16
      kernel_size: 3
      lstm_hidden: 16
      static_hidden: 4
      head_hidden: 16
      dropout: 0.3
      epochs: 40
      batch_size: 64
      learning_rate: 0.001
      weight_decay: 0.0001
      grad_clip: 1.0
      class_weight: balanced
      device: cpu
      random_state: 42
  eval:
    k_consecutive: 2
    n_thresholds: 50
    max_false_alarms_per_1000: 50
  wandb:
    enabled: true
    project: ford-fic
    entity: oromagnoli-
    group: f3-secuenciales
    job_type: train
    tags:
    - f3
    - cnn-lstm
    - tutora
    - panel-seq-v1
    mode: online
    log_artifacts: false
  output_dir: experiments
  _config_path: configs/exp_cnn_lstm.yaml
