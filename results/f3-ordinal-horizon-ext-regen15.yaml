note: 'RE-CORRIDA de f3-ordinal-horizon-ext (bins extendidos) contra el panel POST-1eab4a1;
  el registro sin sufijo (0,1567) es del panel pre-fix y NO se compara con este. Misma
  config, solo --run-name. Por fila 0,1498, la mas baja de las tres post-fix (control
  0,1612, ordinal restringido 0,1568): post-fix la extendida pasa a ser la peor, al
  revés de lo que daba el panel viejo. Conserva el mejor Brier (0,1533 contra 0,1727
  del control), que era su otro rasgo. Por vehiculo con mean el lift baja a 1,29x
  contra 1,54x del control: el eje de vehiculo tampoco la salva. Ojo con un numero:
  (a'') = +0,0118, POSITIVO, el unico positivo fuera de survival stacking en todo
  el registro. Esta medido con R=1 y nada mas, asi que no es comparable con el +0,0162
  +/- 0,0033 de survival, que esta confirmado con R=3; queda anotado como pista sin
  medir, no como resultado. Contra el techo de cohorte de 0,2627 no llega.'
