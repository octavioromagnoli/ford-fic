run: f3-gru-seq-signals
logged_on: '2026-09-20'
note: 'El mismo GRU con el pooling por atencion (el default del builder). 5 semillas
  x R=3: PR-AUC 0,1515 +- 0,0012 / ROC 0,5712. Es la PEOR de las tres variantes de
  pooling: attention < mean (0,1588) < last (0,1645). attention_weights() explica
  por que: la atencion aprende un peso monotono hacia el corte (1,56x el uniforme
  en el ultimo bin, 0,63x en el mas viejo, entropia 0,885 del maximo), o sea una version
  difusa de last, con 416 parametros mas. No hay senal en el medio de la ventana que
  justifique la atencion.'
