config:
  name: f3-gru-seq-signals
  seed: 42
  data:
    panel: ${DATA_DIR}/processed/panel_seq_v1.parquet
  splits:
    path: ${DATA_DIR}/processed/splits_r3.json
    n_splits: 5
    seed: 42
    build_if_missing: false
    strict: true
    stratify:
      column: label
      level: vehicle
    min_valid_positives: 5
    n_repeats: 3
    test_split: ${DATA_DIR}/processed/test_split.json
  model:
    name: gru_seq
    params:
      sequence_meta: ${DATA_DIR}/processed/panel_seq_v1_meta.json
      pooling: attention
      hidden: 24
      num_layers: 1
      attention_hidden: 16
      static_hidden: 4
      head_hidden: 16
      dropout: 0.3
      epochs: 40
      batch_size: 64
      learning_rate: 0.001
      weight_decay: 0.0001
      grad_clip: 1.0
      class_weight: balanced
      device: cpu
      random_state: 42
  eval:
    k_consecutive: 2
    n_thresholds: 50
    max_false_alarms_per_1000: 50
  wandb:
    enabled: true
    project: ford-fic
