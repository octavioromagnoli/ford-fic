run: f3-gpboost-survival
logged_on: '2026-09-20'
note: 'El mismo apilado con intercept aleatorio por vehiculo (GPBoost). NO mejora:
  0.143 de PR-AUC contra 0.161 sin efecto aleatorio. El motivo esta medido: la varianza
  del intercept se estima en 9.4-10.3 (sd ~3.1 en logit) porque ~100 de los ~137 vehiculos
  de cada train no tienen ni un hazard positivo y su intercept se va a -inf (cuasi-separacion).
  El efecto aleatorio se come la senal en vez de regularizarla, y en validacion no
  sirve porque el vehiculo nunca fue visto (split agrupado). Fijando sigma2 en 0.1-2
  recupera hasta 0.154, sigue por debajo. Ver docs/memoria/f3-survival-stacking.md.'
