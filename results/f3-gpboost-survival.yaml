run: f3-gpboost-survival
logged_on: '2026-09-20'
note: 'GPBoost (efecto aleatorio por vehiculo) contra el panel POST-1eab4a1. PR-AUC
  por fila 0,1431, el MAS BAJO de los finalistas, y sin embargo es el que mas sabe
  del cuando por lejos: (a'') +0,0562 y ROC dentro del vehiculo 0,8582 (contra 0,5956
  de survival stacking y 0,5950 del control). Auditado: (a0) 0,1144 vs 0,1252 PASS,
  (a'') PASS -> APROBADA. Es el ejemplo mas claro de por que el PR-AUC por fila no
  es el numero de este problema: el efecto aleatorio por vehiculo se come el ''que
  auto'' y deja el score midiendo casi solo el ''cuando'', que es lo que el producto
  necesita y lo que el PR-AUC por fila penaliza. Merece mirarse en serio antes de
  decidir.


  [AUDITORIA · anotado al revisar los criterios] La auditoria (a) —permutar features

  dentro de cada vehiculo esperando que el PR-AUC cayera a la tasa base— NO es un
  null en

  este panel: deja intacto que vehiculos fallan, que es de donde sale casi todo el
  PR-AUC,

  y sube a 0,17-0,21. Cualquier lectura de esta corrida que la haya citado como aprobada

  paso un test que no mide timing. Los criterios ahora son (a0) y (a''); el piso es
  el

  techo de cohorte (0,2627 / lift 2,10x), no la tasa base.'
