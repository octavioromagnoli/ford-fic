run: f3-survival-stacking-r3
logged_on: '2026-09-20'
note: 'CV repetida R=3 de survival stacking, contra el panel POST-1eab4a1. (a'') =
  +0,0162 +/- 0,0033 (min +0,0128, max +0,0207), POSITIVO en las tres pasadas. Contra
  el control R=3 (-0,0055 +/- 0,0040) los rangos son disjuntos y caen de lados opuestos
  del cero: la diferencia de 0,0217 es ~4x el desvio combinado (0,0052), asi que el
  +0,015 SI supera la dispersion. Es lo unico que separa a los dos modelos: el PR-AUC
  por fila no (0,1721 +/- 0,0135 contra 0,1595 +/- 0,0081, rangos solapados) y la
  deteccion tampoco del todo (15,7% +/- 0,9 contra 11,9% +/- 3,2, rangos que se tocan
  en 15,1). Lo que si cambia es la estabilidad: +/-22 km de anticipacion contra +/-2.237.
  Tampoco llega al techo de cohorte de 0,2627.'
