run: f3-survival-stacking
logged_on: '2026-09-20'
note: 'Survival stacking (Craig/Zhong/Tibshirani 2021) sobre el panel v1 + feat_cut_odo:
  hazard discreto por bin de 500 km, score = 1-S(H|x). Empata al LightGBM en PR-AUC
  (0.161 vs 0.161 sobre el MISMO panel reconstruido con el umbral de regen de 15)
  pero llega distinto: Brier 0.114 vs 0.173, C-index 0.570 vs 0.562, deteccion 15%
  vs 7.5% a <=50 FA/1000, y es el unico cuyo orden DENTRO del vehiculo suma PR-AUC
  (+0.015 contra -0.007 del LightGBM). Detalle y auditorias en docs/memoria/f3-survival-stacking.md.'
