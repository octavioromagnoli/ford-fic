note: 'F5 §3.3 (preregistro docs/memoria/f5-preregistro-ss-post-venta.md): survival
  stacking en dias desde c + G, con el conjunto en riesgo de la ventana del registro
  y PEM (Poisson con offset de exposicion). Mismas filas, features (feat_cut_dss en
  vez de feat_cut_odo) y folds que f3-survival-stacking-r3-rebuild. PIERDE: con la
  etiqueta corregida (decide, 1.435 filas con el horizonte dentro de la ventana) detecta
  9,6% +- 2,8 contra 11,9% +- 2,8 (empata) y lift por vehiculo 1,376 contra 1,655
  (pierde por 0,28 contra 0,15 de desvio combinado). Con la etiqueta dura: 9,4% +-
  1,5 y 1,33x contra 15,7% +- 0,9 y 1,62x. (a0) PASS (-0,004). (b) +0,016 de ROC contra
  +0,049 de la referencia: el atajo de calendario desaparece. (a'') +0,067: aprende
  el cuando, y el score queda dominado por los dias desde la venta (rho 0,51). Evaluacion
  D/V: scripts/eval_window_label.py. Build data/rebuild-0921.'
