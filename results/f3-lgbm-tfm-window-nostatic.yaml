  el ranking puede no sobrevivir. No se compara con las corridas posteriores. Las

  metricas de arriba quedan como estaban, sin tocar.


  [AUDITORIA · anotado al revisar los criterios] La auditoria (a) —permutar features

  dentro de cada vehiculo esperando que el PR-AUC cayera a la tasa base— NO es un
  null en

  este panel: deja intacto que vehiculos fallan, que es de donde sale casi todo el
  PR-AUC,

  y sube a 0,17-0,21. Cualquier lectura de esta corrida que la haya citado como aprobada

  paso un test que no mide timing. Los criterios ahora son (a0) y (a''); el piso es
  el

  techo de cohorte (0,2627 / lift 2,10x), no la tasa base.'
