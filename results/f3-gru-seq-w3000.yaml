run: f3-gru-seq-w3000
logged_on: '2026-09-20'
note: 'Barrido de ventana, W=3000 (T=60 bins de 50 km): la fila donde el barrido separa.
  5 semillas: PR-AUC 0,1830 +- 0,0071 (lift 1,328 +- 0,051) / ROC 0,5910 +- 0,0220
  contra el LightGBM de 53 agregados en el mismo panel y los mismos folds (lift 1,208
  / ROC 0,5152). El GBM se degrada con la ventana larga —colapsa 3.000 km en un numero
  por feature— y la recurrente se sostiene. La diferencia (+0,08 de ROC, +0,12 de
  lift) esta muy por encima de la dispersion por semilla.'
