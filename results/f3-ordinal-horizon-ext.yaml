run: f3-ordinal-horizon-ext
logged_on: '2026-09-20'
note: 'Target ordinal con bins EXTENDIDOS más allá de G+H (2.000/3.500/6.000/10.000
  km), la formulación de SCANIA donde la clase 0 es ''lejos del fallo'' y no ''sano'':
  394 filas que hoy son label=0 pero vienen de vehículos que fallan pasan a las clases
  intermedias. Por fila PR-AUC 0.157 (bins restringidos 0.152, control 0.165) y el
  mejor Brier de las tres (0.152 vs 0.173 del control); por vehículo con mean el lift
  BAJA a 1.31x (control 1.51x). No gana en ninguno de los dos ejes. Lo que deja: el
  barrido de costo (paga a C_FN/C_FP ~7x, 14% de ahorro) y la auditoría de permutación
  intra-vehículo, que dice que ni este modelo ni el control binario le ganan a su
  propio nulo de cohorte. Corrida local con WANDB_MODE=disabled.'
