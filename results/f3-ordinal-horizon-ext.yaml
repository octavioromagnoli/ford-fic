config:
  name: f3-ordinal-horizon-ext
  seed: 42
  data:
    panel: ${DATA_DIR}/processed/panel.parquet
  splits:
    path: ${DATA_DIR}/processed/splits.json
    n_splits: 5
    seed: 42
    build_if_missing: false
    strict: true
    stratify:
      column: label
      level: vehicle
    min_valid_positives: 5
    n_repeats: 1
    test_split: ${DATA_DIR}/processed/test_split.json
  target:
    name: ordinal_horizon
    params:
      bins_km:
      - 2000
      - 3500
      - 6000
      - 10000
      score_max_tte_km: 3500
  model:
    name: lgbm_ordinal
    params:
      objective: multiclass
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 7
      min_child_samples: 40
      reg_lambda: 5.0
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.7
      class_weight: balanced
      random_state: 42
      verbose: -1
  eval:
    k_consecutive: 2
    n_thresholds: 50
    max_false_alarms_per_1000: 50
    cost_ratios:
