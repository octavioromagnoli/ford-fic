config:
  name: f3-cure-p1-firth
  seed: 42
  data:
    panel: ${DATA_DIR}/processed/panel_landmark_ps.parquet
  splits:
    path: ${DATA_DIR}/processed/splits_landmark_ps_r3.json
    n_splits: 5
    seed: 42
    build_if_missing: false
    strict: true
    stratify:
      column: label
      level: vehicle
    min_valid_positives: 5
    n_repeats: 3
    test_split: ${DATA_DIR}/processed/test_split.json
  preprocessing: none
  target:
    name: cure_window
  model:
    name: cure_mixture
    params:
      incidence: firth
      latency: weibull
      per_landmark: true
      firth_flic: true
      normalizer_params:
        min_ref_vehicles: 10
      max_iter: 1000
      tol: 1.0e-07
      random_state: 42
  eval:
    legacy_blocks: false
    carry_columns:
    - aux_landmark_day
    - aux_dss_entry
    - aux_dss_exit
    - aux_event_in_window
    - aux_gap_days
    - aux_dss_window_end
    - aux_days_to_event_after_cut
    - aux_resolved_negative
    - aux_resolved_negative_e60
    - aux_resolved_negative_e120
    - aux_production_tercile
    - static_SalesCountry_cd
    - aux_static_ProductionDay
    - aux_sale_day
    - window_km
    - aux_landmark_month
    - aux_air_temp_window_mean
    landmark:
      score_column: score
      probability_column: score
      max_false_alarms_per_1000: 50
      extra_false_alarms_per_1000:
      - 100
      e_min_days_sensitivity:
      - 60
      - 120
      n_boot: 2000
  audit_cure:
    event_clock: configs/data/event_clock.yaml
    audits:
    - A0
    - C1
    - C2
    - A3
    - A5
    - C6
    - A6
    compare_to: f3-cure-p0-unitweight
    n_boot: 2000
    a0:
      permutations: 5
      d1_tolerance: 0.05
      d2_tolerance: 0.05
    c1:
      permutations: 2000
      strata:
      - aux_landmark_day
      - aux_production_tercile
      - static_SalesCountry_cd
      alpha: 0.05
    c2:
      floors:
        production_day: aux_static_ProductionDay
        sale_day: aux_sale_day
      production_column: aux_static_ProductionDay
      tercile_column: aux_production_tercile
      max_abs_rho: 0.2
    a3:
      covariates:
      - aux_landmark_month
      - aux_air_temp_window_mean
      - aux_static_ProductionDay
      threshold: 0.02
    a5:
      raw_prefix: aux_raw_
    c6:
      km_column: window_km
    a6:
      reference_run: f3-survival-stacking-r3-rebuild
      first_cut_auc: 0.681
  wandb:
    enabled: true
    project: ford-fic
    entity: oromagnoli-
    group: f3-cure
    job_type: train
    tags:
    - f3
    - cure
    - landmark
    - p1
    - r3
    mode: online
    log_artifacts: true
  output_dir: experiments
  _config_path: configs\exp_cure_p1_firth.yaml
