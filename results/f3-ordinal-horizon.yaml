run: f3-ordinal-horizon
logged_on: '2026-09-20'
note: 'Target ordinal 5 clases con bins RESTRINGIDOS a [G, G+H] = [500, 3500]. Defecto
  de diseño: ese intervalo es exactamente el que ya era label=1, así que clase>0 <=>
  label==1 y el target no aporta nada sobre las 1.775 filas negativas (87% del panel).
  Mide el costo de varianza de partir 254 positivas en cuatro baldes de ~60 sin el
  beneficio de información: PR-AUC 0.152 < control 0.165 y Brier 0.207 > 0.173. Se
  conserva como evidencia; la variante corregida es f3-ordinal-horizon-ext. Costo
  OOF 18.872 con la matriz de SCANIA, que resultó degenerada a esta tasa base (el
  barrido de C_FN/C_FP la reemplaza). Corrida local con WANDB_MODE=disabled.'
