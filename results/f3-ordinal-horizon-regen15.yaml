run: f3-ordinal-horizon-regen15
logged_on: '2026-09-20'
note: 'RE-CORRIDA de f3-ordinal-horizon (bins restringidos) contra el panel POST-1eab4a1;
  el registro sin sufijo (0,1524) es del panel pre-fix y NO se compara con este. Misma
  config, solo --run-name. Por fila 0,1568 contra 0,1612 del control post-fix: sigue
  perdiendo, la decision no cambia. Lo que SI cambia es el orden entre las dos variantes
  ordinales: pre-fix la extendida le ganaba a la restringida (0,1567 vs 0,1524) y
  post-fix es al revés (0,1568 vs 0,1498). Era justo lo que la nota de no-comparabilidad
  advertia: la diferencia entre las dos variantes es del mismo orden que el movimiento
  del panel, asi que ese ranking nunca fue solido. (a'') = -0,0092, negativo. Contra
  el techo de cohorte de 0,2627 no llega.'
