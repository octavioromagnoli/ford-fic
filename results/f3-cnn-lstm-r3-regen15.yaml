run: f3-cnn-lstm-r3-regen15
logged_on: '2026-09-21'
note: 'CNN-LSTM de la tutora, panel secuencial RECONSTRUIDO (umbral 15, build 2026-09-20)
  y R=3 con splits_r3.json. Completado el 21-09 SIN reentrenar: scripts/rescore_run.py
  recalcula desde predictions.parquet con la misma funcion que train.py y reproduce
  oof, oof_by_repeat y operating_point del registro anterior; el panel_seq_v1 reconstruido
  con HEAD es identico en las 200 columnas. Metricas honestas R=3: deteccion 11,9%
  +/- 3,6 (9/5/5 de 53: el 17,0% del R=1 era la repeticion 0; el 9,4% de la columna
  Deteccion es el score promediado, un ensamble) y anticipacion 10.366 +/- 137 km;
  lift por vehiculo (mean) 1,333x. Contra el piso posicional (7,55%, 1,018x) le gana
  por 1,2 desvios y en lift: sigue finalista por el criterio preregistrado, por poco.
  Empata con el control LGBM en deteccion (11,9% +/- 3,2) y pierde en lift (1,494x);
  survival stacking le gana en las dos (15,7% +/- 0,9, 1,616x). (a'') +0,0080 +/-
  0,0051; Brier 0,228 (class_weight balanced, no calibrado). Auditorias R=3: (a0)
  PASS, (a'') PASS, (b) +0,0216 de ROC, MARCA. Detalle: docs/memoria/f3-piso-posicional.md.
  Nota del registro anterior (20-09), que sigue valiendo: 5 semillas de red dan 0,1580
  +/- 0,0023 / ROC 0,5699; el numero viejo (0,153 / 0,574, results/f3-cnn-lstm-tutora.yaml)
  es del umbral de 5 y R=1 y no se compara.'
