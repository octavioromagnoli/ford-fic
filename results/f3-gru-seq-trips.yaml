config:
  name: f3-gru-seq-trips
  seed: 42
  data:
    panel: ${DATA_DIR}/processed/panel_seq_trips.parquet
  splits:
    path: ${DATA_DIR}/processed/splits_r3.json
    n_splits: 5
    seed: 42
    build_if_missing: false
    strict: true
    stratify:
      column: label
      level: vehicle
