      epochs: 40
      batch_size: 64
      learning_rate: 0.001
      weight_decay: 0.0001
      grad_clip: 1.0
      class_weight: balanced
      device: cpu
      random_state: 42
  eval:
    k_consecutive: 2
    n_thresholds: 50
    max_false_alarms_per_1000: 50
